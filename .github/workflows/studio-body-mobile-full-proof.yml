name: "ZX7 BODY — Integrated Mobile + Native Release Proof"
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/studio-body-mobile-full-proof.yml"
  push:
    branches: [main]
    paths:
      - "studio_next/**"
      - "motion_studio/**"
      - "pyproject.toml"
      - ".github/workflows/studio-body-mobile-full-proof.yml"
# Free runner minutes: superseded same-branch proof runs cannot waste native compute.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  actual-installed-original-media-body:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install actual free native media tools and physical desktop display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender ffmpeg melt frei0r-plugins inkscape xvfb python3-tk fonts-dejavu-core fonts-noto-core
          python -m pip install --no-cache-dir "numpy>=1.26,<3" "Pillow>=10,<13" "opentimelineio>=0.17,<1" "fonttools>=4,<5" "OpenEXR>=3.3,<4" "opencolorio>=2.5,<2.6" "opencv-python-headless>=4.10,<5"
          # The full test discovery includes native model/editor controls,
          # whose declared extra requires MCP and jsonschema. Without it,
          # 92 controller tests fail during setup before any real assertion.
          # Use the existing pinned project extra; never skip these tests.
          python -m pip install --no-cache-dir '.[editor]'
          python - <<'PY'
          import importlib.metadata as metadata
          import jsonschema
          import mcp
          print("DECLARED EDITOR TEST DEPENDENCIES", {
              "jsonschema": metadata.version("jsonschema"),
              "mcp": metadata.version("mcp"),
          })
          PY
      - name: Verify complete contracts, real process death, pause/restart/resume and actual graphical client
        env:
          ZX7_DESKTOP_QA_PNG: ${{ github.workspace }}/output/body-release-proof/desktop-qa.png
          ZX7_INCREMENTAL_CINEMA_PROOF: ${{ github.workspace }}/output/body-release-proof/incremental-cinema
          ZX7_COLOR_VFX_PROOF: ${{ github.workspace }}/output/body-release-proof/color-vfx-proven
          ZX7_EXR_VFX_PROOF: ${{ github.workspace }}/output/body-release-proof/linear-exr-proven
          ZX7_OBSERVATION_PROOF: ${{ github.workspace }}/output/body-release-proof/actual-director-review
          ZX7_CGI_CONTROLS_PROOF: ${{ github.workspace }}/output/body-release-proof/cgi-controls-core
          ZX7_DEFORM_PROOF: ${{ github.workspace }}/output/body-release-proof/cloth-morph-core
        run: |
          mkdir -p output/body-release-proof
          python -m compileall -q studio_next motion_studio
          set -o pipefail
          xvfb-run -a python -m unittest discover -s studio_next -p 'test_*.py' -v 2>&1 | tee output/body-release-proof/all-tests.log
      - name: Build and install the actual wheel into a separate Python environment
        run: |
          python -m pip wheel --no-deps --wheel-dir output/body-release-proof/wheels .
          python -m venv --system-site-packages "$RUNNER_TEMP/zx7-body-installed"
          # This venv deliberately inherits global site packages. The test
          # install above already registers the same package version, so plain
          # pip exits "already satisfied" and never creates venv CLI scripts.
          # Install the exact built wheel into THIS venv even when a globally
          # visible copy has the same version.
          "$RUNNER_TEMP/zx7-body-installed/bin/python" -m pip install --ignore-installed --no-deps output/body-release-proof/wheels/*.whl
          test -x "$RUNNER_TEMP/zx7-body-installed/bin/zx7-client"
          test -x "$RUNNER_TEMP/zx7-body-installed/bin/zx7-desktop"
          test -x "$RUNNER_TEMP/zx7-body-installed/bin/zx7-archive"
          test -x "$RUNNER_TEMP/zx7-body-installed/bin/zx7-relink-otio"
          python -m venv "$RUNNER_TEMP/zx7-body-minimal"
          "$RUNNER_TEMP/zx7-body-minimal/bin/python" -m pip install --no-deps output/body-release-proof/wheels/*.whl
          "$RUNNER_TEMP/zx7-body-minimal/bin/python" -I - <<'PY'
          import tempfile
          from studio_next.body_integration import body_catalog
          with tempfile.TemporaryDirectory() as root:
              installed={x['id']:x for x in body_catalog(root).discover()}
              assert installed['body.motion2d']['status']=='needs_setup',installed
          print('MINIMAL INSTALLED WHEEL DOES NOT CLAIM ABSENT RENDERER LIBRARIES')
          PY
      - name: Installed package independently renders original 3D, 2D, sound, editable cut and full decoded MP4
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/zx7-body-installed/bin/python" - <<'PY'
          from pathlib import Path
          import os, studio_next
          installed=Path(studio_next.__file__).resolve()
          assert not installed.is_relative_to(Path(os.environ['GITHUB_WORKSPACE']).resolve()), installed
          print('ACTUAL SEPARATELY INSTALLED BODY PACKAGE',installed)
          PY
          "$RUNNER_TEMP/zx7-body-installed/bin/python" -u -m studio_next.body_native_proof --out "$GITHUB_WORKSPACE/output/body-release-proof/native"
          "$RUNNER_TEMP/zx7-body-installed/bin/zx7-client" --help
          "$RUNNER_TEMP/zx7-body-installed/bin/zx7-desktop" --help
          "$RUNNER_TEMP/zx7-body-installed/bin/zx7-archive" --help
          "$RUNNER_TEMP/zx7-body-installed/bin/zx7-relink-otio" --help
      - name: Verify pinned Blender 4.5.15 for installed product CGI acceptance
        run: |
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 30 --max-time 240 \
            https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz \
            -o "$RUNNER_TEMP/blender.tar.xz"
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'blender.tar.xz'
          with p.open('rb') as stream:actual=hashlib.file_digest(stream,'sha256').hexdigest()
          assert actual=='0d2b8bb2efe97e6c8eb57de6b7322f8800e1984e3125b60decca5f6771e4773e',actual
          PY
          tar --no-same-owner -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-4.5.15-linux-x64" >> "$GITHUB_PATH"
      - name: Installed native Blender project saves, reopens, revises, renders and reuses actual Geometry Nodes
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/zx7-body-installed/bin/python" -I -u -m studio_next.body_motion_proof \
            --workspace "$GITHUB_WORKSPACE/output/body-release-proof/native-motion-project"
      - name: Installed native editable visual graph retains original RGBA, float EXR and durable source custody
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/zx7-body-installed/bin/python" -I -u -m studio_next.body_visual_proof \
            --workspace "$GITHUB_WORKSPACE/output/body-release-proof/native-visual-graph"
      - name: Installed public BODY actually renders CGI and tracked occluded VFX
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/zx7-body-installed/bin/python" -u -m studio_next.body_cgi_proof \
            --workspace "$GITHUB_WORKSPACE/output/body-release-proof/cgi-vfx" --size 384 --frames 24 --samples 16
          "$RUNNER_TEMP/zx7-body-installed/bin/python" -u -m studio_next.body_cgi_controls_proof \
            --workspace "$GITHUB_WORKSPACE/output/body-release-proof/cgi-controls" --size 128 --samples 8
          "$RUNNER_TEMP/zx7-body-installed/bin/python" -u -m studio_next.body_deform_proof \
            --workspace "$GITHUB_WORKSPACE/output/body-release-proof/deform-liquid" --size 128 --samples 6
      - name: Save exact release evidence without certifying artistic quality
        run: |
          python - <<'PY'
          import hashlib,json,os,sqlite3
          from pathlib import Path
          from scripts.release_test_summary import parse_unittest_summary
          root=Path('output/body-release-proof')
          log=(root/'all-tests.log').read_text()
          # Reuse the independently regression-tested strict parser: an
          # arbitrary positive number of *actual* skips is not a failure,
          # but failed/truncated runs and invented skip totals remain fatal.
          tests_run,tests_skipped=parse_unittest_summary(log)
          physical=json.loads((root/'native/verified-native-body-result.json').read_text())
          assert physical['real_3d_rendered'] and physical['real_2d_rendered']
          assert physical['exact_all_nodes_resumed']
          cgi=json.loads((root/'cgi-vfx/native-proof.json').read_text())
          assert cgi['actual_cgi_frames']==24 and cgi['actual_tracked_frames']==24
          assert cgi['original_audio_decoded_pcm_identical']
          controls=json.loads((root/'cgi-controls/controls-proof.json').read_text())
          assert controls['all_checks_passed'] and controls['original_clock_subset_physics_identical']
          assert controls['original_clock_subset_picture_within_quantization_tolerance']
          assert controls['actual_dynamic_body_settled_on_collider']
          deform=json.loads((root/'deform-liquid/deform-proof.json').read_text())
          assert deform['all_requested_checks_passed'] and deform['liquid_native_executed']
          assert all(deform['original_clock_geometry_identical'].values())
          assert all(deform['original_clock_picture_within_quantization_tolerance'].values())
          motion=json.loads((root/'native-motion-project/motion-proof.json').read_text())
          assert motion['all_checks_passed'] and motion['native_geometry_nodes_executed']
          assert motion['saved_native_project_reopened_and_revised']
          assert motion['failed_native_edit_published_nothing_and_preserved_original']
          assert motion['verified_stages_reused']==5
          assert motion['generated_native_movie_custody_registered']
          visual=json.loads((root/'native-visual-graph/visual-proof.json').read_text())
          assert visual['all_checks_passed'] and visual['original_clock_excerpt_rgba_identical']
          assert visual['float32_rgba_exact'] and visual['generated_float_source_custody_verified']
          assert visual['reused_verified_stages']==8
          assert (root/'desktop-qa.png').is_file()
          release={
            'source_commit':os.environ['GITHUB_SHA'],
            'tests_run':tests_run,
            'tests_discovered':tests_run,
            'tests_skipped':tests_skipped,
            'tests_passed':tests_run-tests_skipped,
            'tests_failed':0,
            'tests_errors':0,
            'actual_gui_and_authenticated_media_roundtrip':True,
            'actual_process_death_publication_recovery_without_rerender':True,
            'actual_pause_restart_and_original_job_resume':True,
            'separately_installed_wheel_native_2d_3d_audio_otio_mp4':True,
            'installed_pbr_cgi_and_planar_occluded_vfx':cgi,
            'installed_native_cgi_controls':controls,
            'installed_native_deform_and_liquid':deform,
            'installed_native_editable_visual_graph':visual,
            'sqlite_runtime':sqlite3.sqlite_version,
            'gpu_video_generation_verified':False,
            'independent_premium_artist_or_original_fold_film_proven':False,
            'artifacts':[
              {'path':str(p.relative_to(root)),'bytes':p.stat().st_size,
               'sha256':hashlib.file_digest(p.open('rb'),'sha256').hexdigest()}
              for p in root.rglob('*') if p.is_file()]
          }
          (root/'verified-release-evidence.json').write_text(json.dumps(release,indent=2)+'\n')
          print(json.dumps(release,indent=2))
          PY
      - name: Retain real installer, original media, editable project and GUI/test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-integrated-mobile-native-body-proof
          path: output/body-release-proof/
          if-no-files-found: warn
          retention-days: 7
