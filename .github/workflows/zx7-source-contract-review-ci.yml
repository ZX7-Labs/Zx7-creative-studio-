name: "ZX7 Host Contract Exact Head Review"
on:
  push:
    branches: [engineering/host-observed-asset-frontier-20261108]
    paths:
      - ".github/workflows/zx7-source-contract-review-ci.yml"
      - "studio_next/**"
      - "scripts/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-contract-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --no-cache-dir '.[production,editor]'
      - run: python -m compileall -q studio_next/native_creative_control.py studio_next/test_native_creative_control.py studio_next/body_editor_client.py studio_next/test_body_editor_client.py scripts/run_native_model_trial.py scripts/test_local_native_trial_request.py
      - run: |
          python -m unittest             studio_next.test_body_editor_client             studio_next.test_body_editor_policy             studio_next.test_body_editor_mcp             studio_next.test_native_creative_control             studio_next.test_native_creative_audit             studio_next.test_capability_fabric             studio_next.test_local_native_structured_model             scripts.test_local_native_trial_request -v
