name: ZX7 G1 — Live Native Save Interleaving and Interrupted-Write Recovery

on:
  pull_request:
    paths:
      - '.github/workflows/zx7-native-save-interleave.yml'
      - 'engines/velorn/native-save-interleaving.patch'
      - 'engines/velorn/prepare-native-interleave-candidate.sh'
      - 'engines/velorn/mcp-e2e.py'
      - 'studio_next/editor_runtime/source-lock.json'
      - 'studio_next/native_editor_source_pin.py'
      - 'studio_next/test_native_save_interleave.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Review isolated source overlay and source-level handshake
        run: |
          set -euo pipefail
          bash -n engines/velorn/prepare-native-interleave-candidate.sh
          bash engines/velorn/prepare-native-interleave-candidate.sh \
            "$GITHUB_WORKSPACE/third_party/velorn" \
            "$RUNNER_TEMP/zx7-native-interleave-review" --inspect
          test ! -e "$RUNNER_TEMP/zx7-native-interleave-review"
          test "$(git -C third_party/velorn rev-parse HEAD)" = "b3c02adbd5c0779feb8abf34978299e9502cc0e7"
          git -C third_party/velorn diff --quiet HEAD --

  installed-native-interleave:
    needs: exact-source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install actual Electron and physical audiovisual inspection dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg unzip xvfb xauth xdotool x11-xkb-utils xkb-data \
            libnss3 libatk-bridge2.0-0 libasound2t64 libgtk-3-0 \
            libgbm1 libxss1 libxdamage1 libxcomposite1 libxrandr2 libx11-xcb1
          python -m pip install --no-cache-dir '.[editor,production]'
      - name: Offline test exact source admission and unsafe kill refusals
        run: |
          python -m unittest \
            studio_next.test_native_save_interleave \
            studio_next.test_native_save_ordering \
            studio_next.test_native_close_proof \
            studio_next.test_native_crash_proof \
            studio_next.test_native_pointer_proof \
            studio_next.test_native_revision_fence -v
          python -m py_compile \
            engines/velorn/native_save_interleave_flow.py \
            engines/velorn/native_save_interleave_proof.py \
            engines/velorn/mcp-e2e.py
      - name: Install distinct source-pinned CI-only Electron save-interleaving child
        run: |
          editor="$RUNNER_TEMP/zx7-native-save-interleave-installed"
          bash engines/velorn/prepare-native-interleave-candidate.sh \
            "$GITHUB_WORKSPACE/third_party/velorn" "$editor" --install
          expected=$(python -c 'import json;print(json.load(open("studio_next/editor_runtime/source-lock.json"))["collab_save_interleave_revision"])')
          test "$(git -C "$editor" rev-parse HEAD)" = "$expected"
          git -C "$editor" diff --quiet HEAD --
          echo "ZX7_SAVE_INTERLEAVE_EDITOR=$editor" >> "$GITHUB_ENV"
      - name: Build actual source-installed Electron with Chromium sandbox
        run: |
          cd "$ZX7_SAVE_INTERLEAVE_EDITOR"
          bash "$GITHUB_WORKSPACE/engines/velorn/install-ci-dependencies.sh" supported-electron
          npm run build
          test -s dist/index.html
          helper="$PWD/node_modules/electron/dist/chrome-sandbox"
          test -f "$helper"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          test "$(xvfb-run -a node_modules/electron/dist/electron --version)" = "v45.2.3"
      - name: Real X11 live GUI edit during blocked save and kernel death before rename
        run: |
          python -u engines/velorn/mcp-e2e.py \
            --source "$ZX7_SAVE_INTERLEAVE_EDITOR" \
            --xvfb-binary /usr/bin/Xvfb \
            --display 127.0.0.1:97
      - name: Original pinned editor unchanged after all real physical tests
        if: always()
        run: |
          test "$(git -C third_party/velorn rev-parse HEAD)" = "b3c02adbd5c0779feb8abf34978299e9502cc0e7"
          git -C third_party/velorn diff --quiet HEAD --
