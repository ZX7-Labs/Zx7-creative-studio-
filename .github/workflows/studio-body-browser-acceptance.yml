name: "ZX7 BODY — Real Mobile Browser Acceptance"
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "studio_next/**"
      - "motion_studio/**"
      - "pyproject.toml"
      - "scripts/release_test_summary.py"
      - ".github/workflows/studio-body-browser-acceptance.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/studio-body-browser-acceptance.yml"
      - "studio_next/test_body_browser.py"
      - "studio_next/test_body_revision_impact.py"
      - "studio_next/body_mobile.py"
      - "studio_next/test_body_revision_http.py"
      - "studio_next/body_revision_impact.py"
      - "studio_next/body_service.py"
      - "studio_next/body_verified_delivery.py"
      - "studio_next/body_host_resources.py"
      - "studio_next/test_body_host_resources.py"
      - "studio_next/body_download_tickets.py"
      - "studio_next/media_vault.py"
      - "studio_next/body_integration.py"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-mobile-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real browser and real media source decoders
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i 's#http://us-east-2.ec2.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --no-cache-dir "playwright>=1.55,<2" "Pillow>=10,<13"
          python -m playwright install --with-deps chromium
      - name: Prove mobile owner UI with running Chromium and actual HTTP media rights
        shell: bash
        env:
          ZX7_BROWSER_QA_PNG: ${{ github.workspace }}/output/real-browser/mobile-operator.png
        run: |
          mkdir -p output/real-browser
          set -o pipefail
          python -m unittest studio_next.test_body_browser -v 2>&1 | tee output/real-browser/browser-run.txt
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from scripts.release_test_summary import parse_unittest_summary
          root = Path('output/real-browser')
          total, skipped = parse_unittest_summary((root/'browser-run.txt').read_text())
          assert skipped == 0, 'Real browser acceptance did not execute every test'
          with Image.open(root/'mobile-operator.png') as image:
              assert image.format == 'PNG' and image.width > 0 and image.height > 0
              image.verify()
          print(f'Actual Chromium browser acceptance: {total} passed, zero skipped')
          PY
      - name: Keep real browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-real-browser-production-console-evidence
          path: output/real-browser/
          if-no-files-found: warn
          retention-days: 7
