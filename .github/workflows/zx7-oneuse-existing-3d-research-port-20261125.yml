name: ZX7 existing 3D metadata research port — isolated verification
on:
  push:
    branches: [trial/body-existing-3d-research-port-20261125]
    paths:
      - 'studio_next/creative_research*.py'
      - 'studio_next/test_creative_research.py'
      - 'studio_next/body_integration.py'
      - '.github/workflows/zx7-oneuse-existing-3d-research-port-20261125.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose official ambientCG metadata contract
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse
          for q,t in (("rock","3d-model"),("apple","3d-model"),("wood","material"),("sky","hdri")):
              u="https://ambientcg.com/api/v3/assets?"+urllib.parse.urlencode({"q":q,"type":t,"limit":3,"include":"title,type"})
              with urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"ZX7 public metadata contract check"}),timeout=20) as r:
                  o=json.load(r)
              items=o.get("assets",[])
              print("AMBIENTCG_CONTRACT",q,t,"count",len(items),"first",json.dumps(items[0] if items else {},ensure_ascii=True)[:1500])
          PY
