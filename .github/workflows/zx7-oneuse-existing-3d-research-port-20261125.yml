name: ZX7 existing 3D metadata research port — isolated verification
on:
  push:
    branches: [trial/body-existing-3d-research-port-20261125]
    paths:
      - 'studio_next/creative_research*.py'
      - 'studio_next/test_creative_research.py'
      - 'studio_next/body_integration.py'
      - '.github/workflows/zx7-oneuse-existing-3d-research-port-20261125.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check real secondary provider adapter against known public catalog matches
        run: |
          python - <<'PY'
          from studio_next.creative_research import _public_api_json
          from studio_next.creative_research_3d import ambientcg_assets
          # The prior rock query genuinely returned zero matches; absence
          # is valid and must not be manufactured into a candidate.
          for query, kind in (("apple","3d-model"),("wood","material"),("sky","hdri")):
              results=ambientcg_assets(_public_api_json, query, 3, type_name=kind)
              assert results and all(x["rights_status"]=="candidate_unverified" and x["asset_kind"]==kind for x in results), kind
              print("REAL_AMBIENTCG",kind,len(results),flush=True)
          PY
