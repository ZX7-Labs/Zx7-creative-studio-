name: ZX7 Native Preview Admission — source-bound regression
on:
  push:
    branches:
      - engineering/host-observed-asset-frontier-20261108
    paths:
      - ".github/workflows/zx7-native-preview-ci.yml"
      - "studio_next/native_creative_control.py"
      - "studio_next/test_native_creative_control.py"
      - "scripts/run_native_model_trial.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zx7-native-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  protocol-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared native editor protocol dependencies
        run: python -m pip install --no-cache-dir '.[production,editor]'
      - name: Compile changed files
        run: python -m compileall -q studio_next/native_creative_control.py studio_next/test_native_creative_control.py scripts/run_native_model_trial.py
      - name: Run real protocol, hostile audit, capability and model adapter regressions
        run: |
          python -m unittest             studio_next.test_native_creative_control             studio_next.test_native_creative_audit             studio_next.test_capability_fabric             studio_next.test_local_native_structured_model             scripts.test_local_native_trial_request -v
