name: ZX7 Real Reference Editing Observatory

on:
  push:
    branches:
      - "proof/local-brain-60s-native-film-20261101"
    paths:
      - "studio_next/reference_observatory.py"
      - "studio_next/reference_evidence_tools.py"
      - "studio_next/creative_research_mcp.py"
      - "studio_next/creative_evidence_memory.py"
      - "studio_next/test_creative_evidence_memory.py"
      - "studio_next/test_reference_mcp.py"
      - "studio_next/pro_scene_detector.py"
      - "studio_next/test_pro_scene_detector.py"
      - "pyproject.toml"
      - "scripts/repo_audit.py"
      - "scripts/test_repo_audit.py"
      - "studio_next/test_reference_observatory.py"
      - ".github/workflows/zx7-reference-observatory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independently-decoded-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install actual open source decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
      - name: Install and independently test official MCP research transport
        run: python -m pip install --disable-pip-version-check -e '.[research,research_video]'
      - name: Compile reference observatory and regression tests
        run: |
          python -m py_compile studio_next/reference_observatory.py studio_next/reference_evidence_tools.py studio_next/creative_research_mcp.py studio_next/test_reference_observatory.py
          python -m unittest -v studio_next.test_reference_observatory studio_next.test_creative_evidence_memory studio_next.test_reference_mcp studio_next.test_pro_scene_detector
      - name: Verify repository source syntax inventory
        run: |
          python -m compileall -q studio_next scripts

      - name: Check every tracked source file and pin in repository
        run: |
          python -m pip install --disable-pip-version-check 'PyYAML>=6,<7'
          python -m unittest discover -s scripts -p 'test_repo_audit.py' -v
          python scripts/repo_audit.py --out output/repo-audit/all-tracked-files.json
      - name: Preserve complete indexed-file integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-reference-full-source-inventory
          path: output/repo-audit/
          retention-days: 14
