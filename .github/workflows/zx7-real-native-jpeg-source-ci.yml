name: ZX7 source-attested native JPEG not export regression
on:
  push:
    branches: [engineering/host-observed-asset-frontier-20261108]
    paths:
      - ".github/workflows/zx7-real-native-jpeg-source-ci.yml"
      - "studio_next/**"
      - "scripts/**"
      - "engines/velorn/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zx7-real-jpeg-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-native-jpeg:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install actual image encoder/decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Inspect actual pinned upstream and generate/decode real JPEG
        run: |
          test "$(git -C third_party/velorn rev-parse HEAD)" = "b3c02adbd5c0779feb8abf34978299e9502cc0e7"
          node --test engines/velorn/native-marker-preview.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --no-cache-dir '.[production,editor]'
      - name: Compile actual updated model/native image provenance code
        run: |
          python -m compileall -q studio_next/native_creative_control.py studio_next/native_creative_audit.py studio_next/native_editor_source_pin.py scripts/run_native_model_trial.py engines/velorn/native-model-client.py
      - name: Run host-guarded neural-image, physical export and audit regressions
        run: |
          python -m unittest -v studio_next.test_native_creative_control studio_next.test_native_creative_audit studio_next.test_local_native_structured_model studio_next.test_body_editor_client studio_next.test_body_editor_mcp studio_next.test_capability_fabric scripts.test_local_native_trial_request scripts.test_run_nvidia_native_trial.RealNvidiaTrialBootstrapTests.test_pinned_real_electron_preview_attestation_requires_clean_exact_source scripts.test_run_nvidia_native_trial.RealNvidiaTrialBootstrapTests.test_pinned_timeline_jpeg_requires_exact_clean_source_and_two_read_grants
