name: ZX7 isolated G1 same-export audiovisual review RED GREEN
on:
  push:
    branches: [trial/g1-av-review-same-export-identity-20261126]
    paths: ['.github/workflows/zx7-oneuse-g1-av-review-same-export-identity-20261126.yml']
permissions:
  contents: read
jobs:
  source-exact-review:
    if: github.run_attempt == 1 && github.ref == 'refs/heads/trial/g1-av-review-same-export-identity-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 4
          submodules: recursive
      - name: Confirm immutable TDD ancestry and source scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4205dd8d6cc37a73f3976cce31b13082cd307560"
          test "$(git rev-parse HEAD^^)" = "b9184743810c642c32e47e12060ed583de3aa075"
          test "$(git rev-parse HEAD^^^)" = "2b626445ecabd3a2837ac549a98ba9dcda94b96d"
          test "$(git diff --name-only HEAD^^^ HEAD^^)" = "studio_next/test_native_creative_control.py"
          test "$(git diff --name-only HEAD^^ HEAD^)" = "studio_next/native_creative_control.py"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/zx7-oneuse-g1-av-review-same-export-identity-20261126.yml"
          git diff --check HEAD^^^ HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual existing BODY test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir '.[editor,production]'
      - name: Reproduce false A/V guard refusal on original source with new test
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/zx7-red" "b9184743810c642c32e47e12060ed583de3aa075"
          cd "$RUNNER_TEMP/zx7-red"
          if python -m unittest studio_next.test_native_creative_control.NativeCreativeControlTests.test_split_av_review_across_separate_exports_does_not_block_recovery -v > "$RUNNER_TEMP/red.log" 2>&1; then
            cat "$RUNNER_TEMP/red.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/red.log"
          grep -F "AssertionError: 'export_timeline' not found" "$RUNNER_TEMP/red.log"
      - name: Verify exact G1 A/V review, native safety and independent audit green
        run: |
          python -m unittest studio_next.test_native_creative_control studio_next.test_native_creative_audit studio_next.test_native_render_evidence studio_next.test_nvidia_native_tool_model -v
