name: ZX7 one-use G1 — isolated synthetic raw-WAV pitch perception calibration
# Four observation-only calls, below the standing 48-turn synthetic G1 ceiling.
# No native edits, owner files, release, or ordinary CI inference.
on:
  push:
    branches: [trial/g1-omni-sound-calibration-20261127]
    paths: ['.github/workflows/zx7-oneuse-omni-sound-calibration-20261127.yml']
permissions:
  contents: read
concurrency:
  group: zx7-oneuse-g1-omni-sound-calibration-20261127
  cancel-in-progress: false
jobs:
  synthetic-sound:
    if: github.run_attempt == 1 && github.ref == 'refs/heads/trial/g1-omni-sound-calibration-20261127' && github.event.before == '21bac3469fe6d87c630fd66178f5c17796b3810e'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Admit exact source and scoped one-use request
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/trial/g1-omni-sound-calibration-20261127"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "21bac3469fe6d87c630fd66178f5c17796b3810e"
          expected="$(printf '%s\n' '.github/workflows/zx7-oneuse-omni-sound-calibration-20261127.yml' 'research/nvidia-oneuse-omni-sound-calibration-20261127.json' 'research/g1_sound_calibration.py' | LC_ALL=C sort)"
          actual="$(git diff --name-only HEAD^ HEAD | LC_ALL=C sort)"
          test "$actual" = "$expected"
          test "$(git hash-object 'research/g1_sound_calibration.py')" = "1ce7960163fc918db11978d9082a58ac0407b6f4"
          git diff --check HEAD^ HEAD
          python -m scripts.nvidia_av_trial_request 'research/nvidia-oneuse-omni-sound-calibration-20261127.json' --dispatch-request-id 'ZX7_OMNI_G1_SOUND_CALIBRATION_20261127'
      - name: Prove current decoder, raw audio transport and four physical controls without a credential
        run: |
          set -euo pipefail
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          python -m pip install --no-cache-dir '.[editor,production]'
          python -m unittest studio_next.test_nvidia_native_tool_model studio_next.test_body_editor_audio studio_next.test_native_audio_model_input scripts.test_nvidia_av_trial_request -v
          python -m research.g1_sound_calibration --out "$RUNNER_TEMP/zx7-sound-preflight"
      - name: Four independent genuine typed observations from generated WAV only
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${NVIDIA_API_KEY:-}"
          test "$(git hash-object 'research/g1_sound_calibration.py')" = "1ce7960163fc918db11978d9082a58ac0407b6f4"
          test "$(python -m scripts.nvidia_av_trial_request --print-model 'research/nvidia-oneuse-omni-sound-calibration-20261127.json' --dispatch-request-id 'ZX7_OMNI_G1_SOUND_CALIBRATION_20261127')" = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"
          python -u -m research.g1_sound_calibration --out "$RUNNER_TEMP/zx7-sound-live" --execute
      - name: Preserve generated controls, physical receipts and bounded scoring only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-g1-omni-sound-${{ github.sha }}
          path: |
            ${{ runner.temp }}/zx7-sound-live/evaluation.json
            ${{ runner.temp }}/zx7-sound-live/outputs/*.mp4
            ${{ runner.temp }}/zx7-sound-live/outputs/*.wav
            ${{ runner.temp }}/zx7-sound-preflight/evaluation.json
          retention-days: 7
          if-no-files-found: warn
