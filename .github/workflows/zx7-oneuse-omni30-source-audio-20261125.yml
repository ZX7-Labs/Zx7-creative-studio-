name: ZX7 one-use Omni30 original A/V source-preserving continuation
on:
  push:
    branches: ['trial/g1-omni30-source-audio-revision-20261125']
    paths: ['research/nvidia-native-audiovisual-branch-authorized.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: zx7-nvidia-native-creative-acceptance
  cancel-in-progress: false
jobs:
  real-model-native-editor-and-export:
    if: >-
      github.run_attempt == 1 && github.event.before == 'abe09a4d8970c6d02b7dd637aaf8ba4dbe344f9f' && github.event.head_commit.message == 'One-use Omni30 original A/V continuation from verified G1 BODY'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Fetch exact BODY and pinned real editor without writable credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Refuse if HEAD differs from verified G1 source plus exact one-use consent and workflow only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "abe09a4d8970c6d02b7dd637aaf8ba4dbe344f9f"
          actual="$(git diff --name-only HEAD^ HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' '.github/workflows/zx7-oneuse-omni30-source-audio-20261125.yml' 'research/nvidia-native-audiovisual-branch-authorized.json' | LC_ALL=C sort)"
          test "$actual" = "$expected"
      - name: Require a newly approved synthetic picture+sound experiment BEFORE building or exposing credentials
        env:
          APPROVAL_REQUEST_ID: ZX7_G1_OMNI30_SOURCE_AUDIO_20261125_ONESHOT
        run: |
          set -euo pipefail
          python -m scripts.nvidia_av_trial_request \
            research/nvidia-native-audiovisual-branch-authorized.json \
            --dispatch-request-id "$APPROVAL_REQUEST_ID"
      - name: Install original-media codec, sandbox and real MCP dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg xvfb xauth x11-xkb-utils xkb-data \
            libnss3 libatk-bridge2.0-0 libasound2t64 libgtk-3-0 \
            libgbm1 libxss1 libxdamage1 libxcomposite1 libxrandr2 libx11-xcb1
          python -m pip install --no-cache-dir '.[editor,production]'
      - name: Verify actual pinned third-party code and no root execution
        run: |
          test "$(id -u)" -ne 0
          test "$(git -C third_party/velorn rev-parse HEAD)" = "b3c02adbd5c0779feb8abf34978299e9502cc0e7"
          git -C third_party/velorn diff --exit-code HEAD --
      - name: Run offline strict credential and real synthetic fixture admission tests
        run: |
          python -m unittest studio_next.test_nvidia_model \
            studio_next.test_nvidia_tool_model \
            studio_next.test_nvidia_native_tool_model \
            scripts.test_nvidia_smoke_request \
            scripts.test_nvidia_av_trial_request \
            scripts.test_run_nvidia_native_trial -v
      - name: Regression gate selected saved-project A/V render root (before any hosted inference)
        run: python -m unittest -v studio_next.test_native_editor_project.SelectedProjectTests.test_owner_selected_native_av_snapshot_attests_root_before_model
      - name: Revalidate the exact newly admitted A/V consent and fixed provider model
        id: grant
        env:
          APPROVAL_REQUEST_ID: ZX7_G1_OMNI30_SOURCE_AUDIO_20261125_ONESHOT
        run: |
          model=$(python -m scripts.nvidia_av_trial_request --print-model \
            research/nvidia-native-audiovisual-branch-authorized.json \
            --dispatch-request-id "$APPROVAL_REQUEST_ID")
          echo "model=$model" >> "$GITHUB_OUTPUT"
      - name: Rebuild exact source-pinned cumulative ZX7 native editor before provider access
        run: |
          set -euo pipefail
          editor="$RUNNER_TEMP/zx7-cumulative-native-editor"
          bash engines/velorn/prepare-native-loss-aware-extract-candidate.sh \
            "$GITHUB_WORKSPACE/third_party/velorn" "$editor" --install
          expected=$(python -c 'import json;print(json.load(open("studio_next/editor_runtime/source-lock.json"))["loss_aware_extract_revision"])')
          test "$(git -C "$editor" rev-parse HEAD)" = "$expected"
          git -C "$editor" diff --exit-code HEAD --
          echo "ZX7_INTEGRATED_NATIVE_EDITOR=$editor" >> "$GITHUB_ENV"
      - name: Build actual cumulative source editor with no provider credential available
        run: |
          set -euo pipefail
          cd "$ZX7_INTEGRATED_NATIVE_EDITOR"
          bash "$GITHUB_WORKSPACE/engines/velorn/install-ci-dependencies.sh" supported-electron
          npm run build
          test -s dist/index.html
      - name: Preserve real Chromium sandbox
        run: |
          set -euo pipefail
          helper="$ZX7_INTEGRATED_NATIVE_EDITOR/node_modules/electron/dist/chrome-sandbox"
          test -f "$helper"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          test "$(stat -c '%u:%a' "$helper")" = "0:4755"
      - name: Retrieve exact prior synthetic-only, real-model original checkpoint (no provider access)
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 14933927694
          run-id: 45416619151
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/zx7-prior-genuine-native
      - name: Reconcile immutable native source from prior model and generated original media before provider access
        run: |
          set -euo pipefail
          python -u -m scripts.run_nvidia_native_trial --prepare-audiovisual-only --workspace "$RUNNER_TEMP/zx7-nvidia-native-trial" --integrated-editor-source "$ZX7_INTEGRATED_NATIVE_EDITOR"
          python - <<'PY'
          import hashlib, json, os, shutil, stat
          from pathlib import Path
          tmp=Path(os.environ["RUNNER_TEMP"])
          old=tmp/"zx7-prior-genuine-native"
          new=tmp/"zx7-nvidia-native-trial"
          project="hesitation-to-momentum"
          relative=Path("projects")/project
          snapshot=old/relative/"project.comfystudio"
          def verified(path, digest):
              if path.is_symlink() or not path.is_file() or not stat.S_ISREG(path.lstat().st_mode):
                  raise ValueError("Unsafe persisted source identity")
              b=path.read_bytes()
              if hashlib.sha256(b).hexdigest()!=digest:
                  raise ValueError("Persisted genuine model source mismatch")
              return b
          document=verified(snapshot,"52fb4c7a34bf682d311998a42dcc065e10b043c47ecafe740bb01b8be75cec6d")
          # The first genuine export is provenance, NOT an already-reviewed
          # export in this new model session. Copy outside fresh outputs.
          film_bytes=verified(old/"outputs"/"hesitation-to-momentum-cut1.mp4",
              "fe0eaf543c1d558412ed7bb51c8a7fa11268b0d08b5ebf3372600fbccb540d78")
          prior=new/"prior-source-evidence"/"first-export.mp4"
          prior.parent.mkdir(parents=True,exist_ok=True)
          prior.write_bytes(film_bytes)

          video_digest="ea0737ff253bdecd3d730701e6700b04ded8a024eed7715f561a76174f76084d"
          sound_digest="103b054933f3e960254398639014a8c69caeba950f2dc9c7ca4c4a99d86691c6"
          assets=(("video","original-neutral-gradient.mp4",video_digest),
                  ("audio","original-synthetic-sound.wav",sound_digest))
          native=json.loads(document)
          timeline=native.get("timelines")
          clips=timeline[0].get("clips") if type(timeline) is list and len(timeline)==1 else None
          if (native.get("name")!=project or len(clips or ())!=2 or
                  sorted((c.get("type"),c.get("duration"),c.get("startTime"))
                         for c in clips)!=[("audio",6,0),("video",6,0)]):
              raise ValueError("No verified real model-authored two-source project")
          paths={f"assets/{kind}/{name}" for kind,name,_ in assets}
          if {a.get("path") for a in native.get("assets",[])}!=paths:
              raise ValueError("Unexpected original native project media paths")
          destination=new/relative
          destination.mkdir(mode=0o700)
          (destination/"project.comfystudio").write_bytes(document)
          for kind,name,digest in assets:
              original=old/relative/"assets"/kind/name
              original_bytes=verified(original,digest)
              staged=verified(new/"staging"/name,digest)
              if original_bytes!=staged:
                  raise ValueError("New locally generated original differs from original model source")
              output=destination/"assets"/kind/name
              output.parent.mkdir(parents=True,exist_ok=True)
              output.write_bytes(original_bytes)
          grant_file=new/"host-grants.json"
          grant=json.loads(grant_file.read_text())
          from scripts.run_nvidia_native_trial import _EXAMPLE
          reference=json.loads(_EXAMPLE.read_text())
          if reference["allowed_tools"].get("open_project")!="write":
              raise ValueError("Missing trusted native selected-project capability")
          if grant["allowed_tools"].pop("create_project",None)!="write":
              raise ValueError("Native trial create grant changed")
          grant["allowed_tools"]["open_project"]="write"
          grant_file.write_text(json.dumps(grant,indent=2))
          (new/"brief.txt").write_text(
              "Continue original editable six-second audiovisual piece about moving from hesitation "
              "to momentum. The previously model-created project has been reopened from an "
              "independently hashed saved native checkpoint; do not create another project. "
              "Inspect the genuine native timeline and the verified original generated sound "
              "and video. Independently choose the art, sequence, typography, layering, "
              "timing, motion and sound. Produce and independently verify an initial "
              "640x360 24fps six-second H.264/AAC film in a NEW output path. "
              "Inspect actual picture frames at separated matching timestamps and the "
              "full timed audio window. Choose a meaningful original editable improvement, "
              "save it without erasing other artist/source work, export to a DIFFERENT NEW "
              "output filename, verify physical bytes and inspect the same picture/audio "
              "times on the revised file. Use only the native editor's trusted operations. "
              "Never repeat an uncertain write and never overwrite an already existing "
              "output path. The source material is exclusively generated synthetic footage "
              "and sound; no private or external media. "
              "Authorized outputs root: "+str(new/"outputs")+
              "; selected project: "+str(destination)+
              "; originals: "+str(new/"staging"/"original-neutral-gradient.mp4")+
              " and "+str(new/"staging"/"original-synthetic-sound.wav"),
              encoding="utf-8")
          print("Prior real model-authored checkpoint independently admitted; two intact licensed sources; no private input")
          PY
      - name: Real Omni30 model resumes selected native A/V with two independently verified exports
        env:
          APPROVED_MODEL: ${{ steps.grant.outputs.model }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "No consented NVIDIA credential; refusing inference"
            exit 2
          fi
          root="$RUNNER_TEMP/zx7-nvidia-native-trial"
          python -u engines/velorn/native-model-client.py \
            --provider nvidia --model-id "$APPROVED_MODEL" \
            --allow-cloud-image-upload --allow-cloud-audio-diagnostics \
            --structured-actions --indexed-catalog --allow-cloud-original-wav-upload --evaluation-evidence reviewed-av-revision \
            --record-av-project-snapshots --max-turns 48 --model-timeout 180 \
            --source "$ZX7_INTEGRATED_NATIVE_EDITOR" \
            --config "$root/host-grants.json" --state "$root/state" \
            --brief-file "$root/brief.txt" --receipt "$root/native-journal.jsonl" \
            --project "$root/projects/hesitation-to-momentum" \
            --xvfb-binary /usr/bin/Xvfb --display 127.0.0.1:95 \
            > "$root/native-client-stdout.txt" 2> "$root/native-client-stderr.txt"
      - name: Independently decode and reconcile both actual saved native outputs
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,os,hashlib
          from scripts.run_nvidia_native_trial import (
              verify_saved_native_trial,decode_trial_export,decode_trial_audio,
              trial_delivery_profile_compliant,trial_picture_changed)
          from studio_next.native_render_evidence import destination_digest
          root=Path(os.environ["RUNNER_TEMP"])/"zx7-nvidia-native-trial"
          out=(root/"native-client-stdout.txt").read_text()
          try: summary=json.loads(out.strip().splitlines()[-1])
          except (ValueError,IndexError): raise ValueError("No authentic model summary")
          projects=verify_saved_native_trial(root,require_audio=True)
          files=sorted((root/"outputs").glob("*.mp4"))
          decoded={p:(decode_trial_export(p),decode_trial_audio(p,expected_video_seconds=6)) for p in files}
          report={"actual_model_status":summary.get("status"),
                  "host_evidence_satisfied":summary.get("evaluation_evidence_satisfied") is True,
                  "saved_native_project_verified":bool(projects),
                  "decoded_media_count":len(decoded),
                  "media":[{"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
                            "frames":len(v.presentation),"audio_audible":a.audible,
                            "codec_compliant":trial_delivery_profile_compliant(v)}
                           for p,(v,a) in decoded.items()],
                  "artistic_quality_independently_approved":False}
          (root/"native-evaluation.json").write_text(json.dumps(report,indent=2))
          pair=summary.get("reviewed_native_audiovisual_pair")
          if (not summary.get("evaluation_evidence_satisfied") or
                  summary.get("status")!="model_finished_unverified" or
                  not isinstance(pair,list) or len(pair)!=2 or
                  len(decoded)<2 or
                  not all(a.audible and trial_delivery_profile_compliant(v)
                          for v,a in decoded.values())):
              raise ValueError("Model continuation lacks full two-export A/V evidence")
          before=[]
          for item in pair:
              selected=[(v,a) for p,(v,a) in decoded.items()
                       if hashlib.sha256(p.read_bytes()).hexdigest()==item.get("export_sha256")
                       and destination_digest(str(p))==item.get("destination_sha256")]
              if len(selected)!=1: raise ValueError("Reviewed export identity missing")
              before.append(selected[0])
          if not (trial_picture_changed(before[0][0],before[1][0])
                  or before[0][1].pcm_sha256 != before[1][1].pcm_sha256):
              raise ValueError("No independently different reviewed picture/sound")
          print("PASS: two independently physical decoded native exports and source-verified reviewed A/V pair")
          PY
      - name: Independently confirm original and cumulative editor code unchanged
        if: always()
        run: |
          test "$(git -C third_party/velorn rev-parse HEAD)" = "b3c02adbd5c0779feb8abf34978299e9502cc0e7"
          git -C third_party/velorn diff --exit-code HEAD --
          if [[ -n "${ZX7_INTEGRATED_NATIVE_EDITOR:-}" ]]; then
            expected=$(python -c 'import json;print(json.load(open("studio_next/editor_runtime/source-lock.json"))["loss_aware_extract_revision"])')
            test "$(git -C "$ZX7_INTEGRATED_NATIVE_EDITOR" rev-parse HEAD)" = "$expected"
            git -C "$ZX7_INTEGRATED_NATIVE_EDITOR" diff --exit-code HEAD --
          fi
      - name: Preserve only allowed synthetic media, editable native projects and redacted journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-real-nvidia-native-creative-${{ github.sha }}
          # Never upload the entire Electron profile. Prior public trials
          # inadvertently retained Chromium Cookies, Cache, GPUCache and local
          # storage under state/. Those files are not creative evidence and
          # could contain browsing/session data in a real owner environment.
          # The only cloud-approved source is this trial's generated footage.
          path: |
            ${{ runner.temp }}/zx7-nvidia-native-trial/host-grants.json
            ${{ runner.temp }}/zx7-nvidia-native-trial/brief.txt
            ${{ runner.temp }}/zx7-nvidia-native-trial/source-ledger.json
            ${{ runner.temp }}/zx7-nvidia-native-trial/native-evaluation.json
            ${{ runner.temp }}/zx7-nvidia-native-trial/native-journal.jsonl
            ${{ runner.temp }}/zx7-nvidia-native-trial/native-client-stdout.txt
            ${{ runner.temp }}/zx7-nvidia-native-trial/native-client-stderr.txt
            ${{ runner.temp }}/zx7-nvidia-native-trial/staging/original-neutral-gradient.mp4
            ${{ runner.temp }}/zx7-nvidia-native-trial/staging/original-synthetic-sound.wav
            ${{ runner.temp }}/zx7-nvidia-native-trial/prior-source-evidence/first-export.mp4
            ${{ runner.temp }}/zx7-nvidia-native-trial/outputs/*.mp4
            ${{ runner.temp }}/zx7-nvidia-native-trial/projects/**/*.comfystudio
            ${{ runner.temp }}/zx7-nvidia-native-trial/projects/**/assets/video/*.mp4
            ${{ runner.temp }}/zx7-nvidia-native-trial/projects/**/assets/audio/*.wav
            ${{ runner.temp }}/zx7-nvidia-native-trial/projects/**/project.thumbnail.webp
            ${{ runner.temp }}/zx7-nvidia-native-trial/state/av-project-snapshots/*.comfystudio
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 7
