name: "ZX7 NVIDIA — Genuine Native Editor Creative Revision Trial"
# The former visual one-shot request was already used and FAILED.
# Do not attach paid provider access to ordinary pushes or PRs.
on:
  workflow_dispatch:
    inputs:
      trial_mode:
        description: "Only a newly approved, synthetic A/V model audition"
        required: true
        type: choice
        options: [audiovisual]
      approval_request_id:
        description: "Exact new reviewed ID in research/nvidia-native-audiovisual-request.json"
        required: true
        type: string
  # Pull requests only validate the reviewed request. They never execute a
  # cloud neural trial, upload frames or access the NVIDIA credential.
  pull_request:
    branches: [main]
    paths:
      - "research/nvidia-native-trial-request.json"
      - "research/nvidia-native-audiovisual-request.json"
      - ".github/workflows/zx7-nvidia-native-editor-trial.yml"
      - "scripts/nvidia_av_trial_request.py"
      - "scripts/test_nvidia_av_trial_request.py"
      - "scripts/run_nvidia_native_trial.py"
      - "scripts/nvidia_native_trial_request.py"
      - "scripts/test_run_nvidia_native_trial.py"
      - "studio_next/nvidia_model.py"
      - "studio_next/nvidia_native_tool_model.py"
      - "studio_next/test_nvidia_model.py"

permissions:
  contents: read

concurrency:
  # Offline PR admission never waits on or preempts the one real cloud slot.
  group: ${{ github.event_name == 'pull_request' && format('zx7-nvidia-offline-{0}', github.ref) || 'zx7-nvidia-native-creative-acceptance' }}
  cancel-in-progress: false

jobs:
  request-admission-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read exact request source without access to provider credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retain prior historical one-shot request parser contract (no credential access)
        run: python -m scripts.nvidia_native_trial_request research/nvidia-native-trial-request.json
      - name: Verify new A/V mode is DENIED until new source approval and exact dispatch ID
        run: python -m unittest -v scripts.test_nvidia_av_trial_request

  real-model-native-editor-and-export:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.trial_mode == 'audiovisual'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Fetch exact BODY and pinned real editor without writable credentials
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Require a newly approved synthetic picture+sound experiment BEFORE building or exposing credentials
        env:
          APPROVAL_REQUEST_ID: ${{ inputs.approval_request_id }}
        run: |
          set -euo pipefail
          python -m scripts.nvidia_av_trial_request \
            research/nvidia-native-audiovisual-request.json \
            --dispatch-request-id "$APPROVAL_REQUEST_ID"
      - name: Install original-media codec, sandbox and real MCP dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg xvfb xauth x11-xkb-utils xkb-data \
            libnss3 libatk-bridge2.0-0 libasound2t64 libgtk-3-0 \
            libgbm1 libxss1 libxdamage1 libxcomposite1 libxrandr2 libx11-xcb1
          python -m pip install --no-cache-dir '.[editor,production]'
      - name: Verify actual pinned third-party code and no root execution
        run: |
          test "$(id -u)" -ne 0
          test "$(git -C third_party/velorn rev-parse HEAD)" = "b3c02adbd5c0779feb8abf34978299e9502cc0e7"
          git -C third_party/velorn diff --exit-code HEAD --
      - name: Run offline strict credential and real synthetic fixture admission tests
        run: |
          python -m unittest studio_next.test_nvidia_model \
            studio_next.test_nvidia_tool_model \
            studio_next.test_nvidia_native_tool_model \
            scripts.test_nvidia_smoke_request \
            scripts.test_nvidia_av_trial_request \
            scripts.test_run_nvidia_native_trial -v
      - name: Revalidate the exact newly admitted A/V consent and fixed provider model
        env:
          APPROVAL_REQUEST_ID: ${{ inputs.approval_request_id }}
        run: |
          python -m scripts.nvidia_av_trial_request \
            research/nvidia-native-audiovisual-request.json \
            --dispatch-request-id "$APPROVAL_REQUEST_ID"
      - name: Build actual existing source editor with no provider credential available
        working-directory: third_party/velorn
        run: |
          bash ../../engines/velorn/install-ci-dependencies.sh
          npm run build
          test -s dist/index.html
      - name: Preserve real Chromium sandbox
        working-directory: third_party/velorn
        run: |
          helper="$PWD/node_modules/electron/dist/chrome-sandbox"
          test -f "$helper"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          test "$(stat -c '%u:%a' "$helper")" = "0:4755"
      - name: Real NVIDIA creative decisions -> native A/V edit -> timed review -> revised output
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            echo "No NVIDIA_API_KEY Actions secret. Refusing cloud trial."
            exit 2
          fi
          python -u -m scripts.run_nvidia_native_trial \
            --workspace "$RUNNER_TEMP/zx7-nvidia-native-trial" \
            --xvfb-binary /usr/bin/Xvfb --display 127.0.0.1:95 \
            --audiovisual-trial --allow-cloud-audio-diagnostics
      - name: Independently confirm pinned editor code was never modified
        if: always()
        run: |
          test "$(git -C third_party/velorn rev-parse HEAD)" = "b3c02adbd5c0779feb8abf34978299e9502cc0e7"
          git -C third_party/velorn diff --exit-code HEAD --
      - name: Preserve only allowed synthetic media, editable native projects and redacted journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-real-nvidia-native-creative-${{ github.sha }}
          # Never upload the entire Electron profile. Prior public trials
          # inadvertently retained Chromium Cookies, Cache, GPUCache and local
          # storage under state/. Those files are not creative evidence and
          # could contain browsing/session data in a real owner environment.
          # The only cloud-approved source is this trial's generated footage.
          path: |
            ${{ runner.temp }}/zx7-nvidia-native-trial/host-grants.json
            ${{ runner.temp }}/zx7-nvidia-native-trial/brief.txt
            ${{ runner.temp }}/zx7-nvidia-native-trial/source-ledger.json
            ${{ runner.temp }}/zx7-nvidia-native-trial/native-evaluation.json
            ${{ runner.temp }}/zx7-nvidia-native-trial/native-journal.jsonl
            ${{ runner.temp }}/zx7-nvidia-native-trial/native-client-stdout.txt
            ${{ runner.temp }}/zx7-nvidia-native-trial/native-client-stderr.txt
            ${{ runner.temp }}/zx7-nvidia-native-trial/staging/original-neutral-gradient.mp4
            ${{ runner.temp }}/zx7-nvidia-native-trial/staging/original-synthetic-sound.wav
            ${{ runner.temp }}/zx7-nvidia-native-trial/outputs/*.mp4
            ${{ runner.temp }}/zx7-nvidia-native-trial/projects/**/*.comfystudio
            ${{ runner.temp }}/zx7-nvidia-native-trial/projects/**/assets/video/*.mp4
            ${{ runner.temp }}/zx7-nvidia-native-trial/projects/**/assets/audio/*.wav
            ${{ runner.temp }}/zx7-nvidia-native-trial/projects/**/project.thumbnail.webp
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 7
