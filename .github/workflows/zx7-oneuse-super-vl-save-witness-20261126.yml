name: "ZX7 one-use native save-witness Super VL genuine independent audiovisual revision"
# One-use, source-pinned, explicitly owner-authorized G1 experiment.
# NOT a normal CI trigger, public media upload, release gate, or automatic fallback.
on:
  push:
    branches: [trial/g1-super-vl-save-witness-20261126]
    paths:
      - ".github/workflows/zx7-oneuse-super-vl-save-witness-20261126.yml"
permissions:
  contents: read
concurrency:
  group: zx7-oneuse-g1-super-vl-save-witness-20261126
  cancel-in-progress: false
jobs:
  genuine-super-vl-native-av:
    if: github.run_attempt == 1 && github.ref == 'refs/heads/trial/g1-super-vl-save-witness-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout reviewed exact BODY and pinned Velorn without persisted credentials
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 3
          persist-credentials: false
      - name: Authenticate exact owner-scoped source, only two audit files, and one-use request
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/trial/g1-super-vl-save-witness-20261126"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD^)" = "0d39d5bc3c73d61e5a38c7ef93322757743b8d98"
          expected="$(printf '%s\n' '.github/workflows/zx7-oneuse-super-vl-save-witness-20261126.yml' 'research/nvidia-oneuse-super-vl-save-witness-20261126.json' | LC_ALL=C sort)"
          actual="$(git diff --name-only 0d39d5bc3c73d61e5a38c7ef93322757743b8d98 HEAD | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --check 0d39d5bc3c73d61e5a38c7ef93322757743b8d98 HEAD
          python -m scripts.nvidia_av_trial_request research/nvidia-oneuse-super-vl-save-witness-20261126.json --dispatch-request-id ZX7_SUPER_VL_G1_SAVE_CONTENT_WITNESS_20261126
          test "$(git -C third_party/velorn rev-parse HEAD)" = "b3c02adbd5c0779feb8abf34978299e9502cc0e7"
          git -C third_party/velorn diff --exit-code HEAD --
          echo "REVIEWED_SOURCE_48_TURN_ONE_USE_CONSENT_VALIDATED"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install real native-editor codecs, X11, sandbox and existing BODY dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg xvfb xauth x11-xkb-utils xkb-data \
            libnss3 libatk-bridge2.0-0 libasound2t64 libgtk-3-0 \
            libgbm1 libxss1 libxdamage1 libxcomposite1 libxrandr2 libx11-xcb1
          python -m pip install --no-cache-dir '.[editor,production]'
      - name: Validate current real Super VL native model and exact one-use request before building
        run: |
          set -euo pipefail
          python -m unittest studio_next.test_native_creative_control studio_next.test_nvidia_native_tool_model studio_next.test_body_editor_policy scripts.test_nvidia_av_trial_request -v
          python -m scripts.nvidia_av_trial_request research/nvidia-oneuse-super-vl-save-witness-20261126.json --dispatch-request-id ZX7_SUPER_VL_G1_SAVE_CONTENT_WITNESS_20261126
      - name: Rebuild exact cumulative BODY-integrated source pinned native editor
        shell: bash
        run: |
          set -euo pipefail
          editor="$RUNNER_TEMP/zx7-super-vl-cumulative-native-editor"
          bash engines/velorn/prepare-native-loss-aware-extract-candidate.sh \
            "$GITHUB_WORKSPACE/third_party/velorn" "$editor" --install
          expected="$(python -c 'import json;print(json.load(open("studio_next/editor_runtime/source-lock.json"))["loss_aware_extract_revision"])')"
          test "$(git -C "$editor" rev-parse HEAD)" = "$expected"
          git -C "$editor" diff --exit-code HEAD --
          echo "ZX7_INTEGRATED_NATIVE_EDITOR=$editor" >> "$GITHUB_ENV"
      - name: Build actual source-pinned Electron native app with no provider credential
        shell: bash
        run: |
          set -euo pipefail
          cd "$ZX7_INTEGRATED_NATIVE_EDITOR"
          bash "$GITHUB_WORKSPACE/engines/velorn/install-ci-dependencies.sh" supported-electron
          npm run build
          test -s dist/index.html
      - name: Preserve actual Chromium sandbox and unprivileged native editor
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          helper="$ZX7_INTEGRATED_NATIVE_EDITOR/node_modules/electron/dist/chrome-sandbox"
          test -f "$helper"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          test "$(stat -c '%u:%a' "$helper")" = "0:4755"
      - name: One genuine Super VL Brain chooses native video/sound edits, reviews, revises, verifies
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            echo "Missing authorized NVIDIA_API_KEY; no provider trial"
            exit 2
          fi
          model="$(python -m scripts.nvidia_av_trial_request --print-model \
            research/nvidia-oneuse-super-vl-save-witness-20261126.json \
            --dispatch-request-id ZX7_SUPER_VL_G1_SAVE_CONTENT_WITNESS_20261126)"
          test "$model" = "nvidia/nemotron-3.5-super-vl-120b-a12b"
          python -u -m scripts.run_nvidia_native_trial \
            --workspace "$RUNNER_TEMP/zx7-super-vl-native-trial" \
            --model-id "$model" \
            --integrated-editor-source "$ZX7_INTEGRATED_NATIVE_EDITOR" \
            --xvfb-binary /usr/bin/Xvfb --display 127.0.0.1:95 \
            --audiovisual-trial --allow-cloud-audio-diagnostics --indexed-catalog
      - name: Verify original and cumulative editor sources were never rewritten
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C third_party/velorn rev-parse HEAD)" = "b3c02adbd5c0779feb8abf34978299e9502cc0e7"
          git -C third_party/velorn diff --exit-code HEAD --
          if [[ -n "${ZX7_INTEGRATED_NATIVE_EDITOR:-}" ]]; then
            expected="$(python -c 'import json;print(json.load(open("studio_next/editor_runtime/source-lock.json"))["loss_aware_extract_revision"])')"
            test "$(git -C "$ZX7_INTEGRATED_NATIVE_EDITOR" rev-parse HEAD)" = "$expected"
            git -C "$ZX7_INTEGRATED_NATIVE_EDITOR" diff --exit-code HEAD --
          fi
      - name: Preserve only authorized synthetic physical A/V, redacted journal and native project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-oneuse-super-vl-save-witness-real-av-${{ github.sha }}
          path: |
            ${{ runner.temp }}/zx7-super-vl-native-trial/host-grants.json
            ${{ runner.temp }}/zx7-super-vl-native-trial/brief.txt
            ${{ runner.temp }}/zx7-super-vl-native-trial/source-ledger.json
            ${{ runner.temp }}/zx7-super-vl-native-trial/native-evaluation.json
            ${{ runner.temp }}/zx7-super-vl-native-trial/native-journal.jsonl
            ${{ runner.temp }}/zx7-super-vl-native-trial/native-client-stdout.txt
            ${{ runner.temp }}/zx7-super-vl-native-trial/native-client-stderr.txt
            ${{ runner.temp }}/zx7-super-vl-native-trial/staging/original-neutral-gradient.mp4
            ${{ runner.temp }}/zx7-super-vl-native-trial/staging/original-synthetic-sound.wav
            ${{ runner.temp }}/zx7-super-vl-native-trial/outputs/*.mp4
            ${{ runner.temp }}/zx7-super-vl-native-trial/projects/**/*.comfystudio
            ${{ runner.temp }}/zx7-super-vl-native-trial/projects/**/assets/video/*.mp4
            ${{ runner.temp }}/zx7-super-vl-native-trial/projects/**/assets/audio/*.wav
            ${{ runner.temp }}/zx7-super-vl-native-trial/projects/**/project.thumbnail.webp
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 7
