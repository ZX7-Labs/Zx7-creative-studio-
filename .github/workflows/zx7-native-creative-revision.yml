name: ZX7 G1 — Native Creative Revision and Collaboration Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'studio_next/native_creative_revision.py'
      - 'studio_next/test_native_creative_revision.py'
      - 'studio_next/studio_cli.py'
      - 'engines/velorn/mcp-e2e.py'
      - '.github/workflows/zx7-native-creative-revision.yml'
  push:
    branches: [main]
    paths:
      - 'studio_next/native_creative_revision.py'
      - 'studio_next/test_native_creative_revision.py'
      - 'studio_next/studio_cli.py'
      - '.github/workflows/zx7-native-creative-revision.yml'

permissions:
  contents: read

jobs:
  read-only-native-state-and-conflict-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local source and declared editor dependencies
        run: python -m pip install --no-cache-dir '.[editor]'
      - name: Check syntax and packaging
        run: |
          python -m py_compile studio_next/native_creative_revision.py studio_next/studio_cli.py studio_next/test_native_creative_revision.py
          python -c 'from studio_next.native_creative_revision import review_native_collaboration'
      - name: Adversarial native-project identity, change, custody and human-AI conflict oracles
        run: python -m unittest studio_next.test_native_creative_revision -v
      - name: Existing owner CLI remains compatible with native session
        run: python -m unittest studio_next.test_studio_cli -v
