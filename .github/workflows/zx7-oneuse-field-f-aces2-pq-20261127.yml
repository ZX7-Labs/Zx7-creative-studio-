name: ZX7 Field F one-use native ACES2 PQ physical proof
on:
  push:
    branches: [trial/field-f-aces2-pq-physical-20261127]
    paths: [".github/workflows/zx7-oneuse-field-f-aces2-pq-20261127.yml"]
permissions:
  contents: read
concurrency:
  group: zx7-field-f-aces2-pq-20261127
  cancel-in-progress: false
jobs:
  native-hdr-picture:
    if: github.run_attempt == 1 && github.event.before == 'ec0b8a4bd9bd9d2cc0aad612225b169b56344092' && github.ref == 'refs/heads/trial/field-f-aces2-pq-physical-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Authenticate exact candidate and sole proof trigger
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "ec0b8a4bd9bd9d2cc0aad612225b169b56344092"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/zx7-oneuse-field-f-aces2-pq-20261127.yml"
          git diff --check HEAD^ HEAD
          test "$(git hash-object studio_next/body_aces2_movie.py)" = "f70058d92f5e4451fb34931a56ebc85cbd2e9ed9"
          test "$(git hash-object studio_next/body_aces2_preview.py)" = "d1fe5750b4b09241f6a08ee0f025643a7fd7a967"
          test "$(git hash-object studio_next/test_body_aces2_movie.py)" = "a704e2067f1272493d05f6ed0a49f276d538bee2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install actual Blender, FFmpeg, OpenEXR and pinned ACES2 stack
        run: |
          set -euo pipefail
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i 's#http://us-east-2.ec2.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender ffmpeg
          python -m pip install --no-cache-dir '.[editor,production,vfx_exr]' 'opencolorio>=2.5,<2.6'
          python -c 'from studio_next.test_body_aces2_movie import _READY; assert _READY, "Native stack missing; no physical acceptance"'
      - name: Actual encoded PQ luminance/chroma, SDR compatibility and exact plan contract
        run: |
          python -m unittest studio_next.test_body_aces2_movie.ActualDisplayMasterCodec studio_next.test_body_aces2_movie.DisplayContractTests -v
      - name: Execute original native Blender and licensed EXR to actual ACES2 HDR master; retain physical evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zx7-hdr-proof"
          export ZX7_HDR_PROOF_DIR="$RUNNER_TEMP/zx7-hdr-proof"
          python - <<'PY'
          import os, shutil, json, subprocess
          from pathlib import Path
          from studio_next.test_body_aces2_movie import ActualNativeSceneToProRes, _READY
          from studio_next.media_vault import sha256_file
          assert _READY
          dest=Path(os.environ["ZX7_HDR_PROOF_DIR"])
          case=ActualNativeSceneToProRes("test_original_linear_scene_produces_real_pq_hdr_movie")
          case.setUp()
          try:
              case.test_original_linear_scene_produces_real_pq_hdr_movie()
              for source,name in ((case.archive,"original-32f-exr.zip"),(case.scene,"original-scene.json"),
                                  (case.planfile,"selected-hdr-plan.json"),(case.root/"real-aces2-pq.mov","master.mov")):
                  shutil.copy2(source,dest/name)
              probe=json.loads(subprocess.check_output(["ffprobe","-v","error","-count_frames","-show_streams","-of","json",str(dest/"master.mov")]))
              (dest/"physical-proof.json").write_text(json.dumps({"source_commit":os.environ["GITHUB_SHA"],
                  "candidate":"ec0b8a4bd9bd9d2cc0aad612225b169b56344092","physical_native_test_passed":True,
                  "decoded_luma_oracle_passed":True,"source_files":[{"file":p.name,"sha256":sha256_file(p),"bytes":p.stat().st_size}
                      for p in sorted(dest.iterdir())],"probe":probe,"creative_acceptance":False},indent=2))
              print("ACTUAL_NATIVE_EXR_ACES2_PQ_HDR_PICTURE_PROOF_PASS",flush=True)
          finally:
              case.tearDown()
          PY
      - name: Retain synthetic source and decoded proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-field-f-native-hdr-proof
          path: ${{ runner.temp }}/zx7-hdr-proof/
          if-no-files-found: warn
          retention-days: 7
