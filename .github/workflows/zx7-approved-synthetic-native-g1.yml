name: "ZX7 one-use verified-source real NVIDIA G1 — 2026-11-24"
# Isolated, explicitly authorized one-shot branch; never ordinary PR or main inference.
# The permanent manual-only workflow and its disabled request remain unchanged.
on:
  push:
    branches: ['trial/g1-exact-6e-real-nvidia-20261124']
    paths: ['research/nvidia-native-audiovisual-branch-authorized.json']
permissions:
  contents: read
concurrency:
  group: zx7-nvidia-native-creative-acceptance
  cancel-in-progress: false
jobs:
  real-model-native-editor-and-export:
    if: >-
      github.run_attempt == 1 && github.event.before == '6e809245596c2bd46b210d8abe0e90787f18ce04' && github.event.head_commit.message == 'Run one approved exact-source G1 synthetic NVIDIA trial'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Fetch exact BODY and pinned real editor without writable credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify the tested BODY source is identical to the exact green base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "6e809245596c2bd46b210d8abe0e90787f18ce04"
          actual="$(git diff --name-only HEAD^ HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' '.github/workflows/zx7-approved-synthetic-native-g1.yml' 'research/nvidia-native-audiovisual-branch-authorized.json' | LC_ALL=C sort)"
          test "$actual" = "$expected"
      - name: Require a newly approved synthetic picture+sound experiment BEFORE building or exposing credentials
        env:
          APPROVAL_REQUEST_ID: ZX7_G1_EXACT_6E_REAL_NVIDIA_20261124_ONCE
        run: |
          set -euo pipefail
          python -m scripts.nvidia_av_trial_request \
            research/nvidia-native-audiovisual-branch-authorized.json \
            --dispatch-request-id "$APPROVAL_REQUEST_ID"
      - name: Install original-media codec, sandbox and real MCP dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg xvfb xauth x11-xkb-utils xkb-data \
            libnss3 libatk-bridge2.0-0 libasound2t64 libgtk-3-0 \
            libgbm1 libxss1 libxdamage1 libxcomposite1 libxrandr2 libx11-xcb1
          python -m pip install --no-cache-dir '.[editor,production]'
      - name: Verify actual pinned third-party code and no root execution
        run: |
          test "$(id -u)" -ne 0
          test "$(git -C third_party/velorn rev-parse HEAD)" = "b3c02adbd5c0779feb8abf34978299e9502cc0e7"
          git -C third_party/velorn diff --exit-code HEAD --
      - name: Run offline strict credential and real synthetic fixture admission tests
        run: |
          python -m unittest studio_next.test_nvidia_model \
            studio_next.test_nvidia_tool_model \
            studio_next.test_nvidia_native_tool_model \
            scripts.test_nvidia_smoke_request \
            scripts.test_nvidia_av_trial_request \
            scripts.test_run_nvidia_native_trial -v
      - name: Revalidate the exact newly admitted A/V consent and fixed provider model
        id: grant
        env:
          APPROVAL_REQUEST_ID: ZX7_G1_EXACT_6E_REAL_NVIDIA_20261124_ONCE
        run: |
          model=$(python -m scripts.nvidia_av_trial_request --print-model \
            research/nvidia-native-audiovisual-branch-authorized.json \
            --dispatch-request-id "$APPROVAL_REQUEST_ID")
          echo "model=$model" >> "$GITHUB_OUTPUT"
      - name: Rebuild exact source-pinned cumulative ZX7 native editor before provider access
        run: |
          set -euo pipefail
          editor="$RUNNER_TEMP/zx7-cumulative-native-editor"
          bash engines/velorn/prepare-native-loss-aware-extract-candidate.sh \
            "$GITHUB_WORKSPACE/third_party/velorn" "$editor" --install
          expected=$(python -c 'import json;print(json.load(open("studio_next/editor_runtime/source-lock.json"))["loss_aware_extract_revision"])')
          test "$(git -C "$editor" rev-parse HEAD)" = "$expected"
          git -C "$editor" diff --exit-code HEAD --
          echo "ZX7_INTEGRATED_NATIVE_EDITOR=$editor" >> "$GITHUB_ENV"
      - name: Build actual cumulative source editor with no provider credential available
        run: |
          set -euo pipefail
          cd "$ZX7_INTEGRATED_NATIVE_EDITOR"
          bash "$GITHUB_WORKSPACE/engines/velorn/install-ci-dependencies.sh" supported-electron
          npm run build
          test -s dist/index.html
      - name: Preserve real Chromium sandbox
        run: |
          set -euo pipefail
          helper="$ZX7_INTEGRATED_NATIVE_EDITOR/node_modules/electron/dist/chrome-sandbox"
          test -f "$helper"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          test "$(stat -c '%u:%a' "$helper")" = "0:4755"
      - name: Real NVIDIA creative decisions -> native A/V edit -> timed review -> revised output
        env:
          APPROVED_MODEL: ${{ steps.grant.outputs.model }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            echo "No NVIDIA_API_KEY Actions secret. Refusing cloud trial."
            exit 2
          fi
          audio_flags=()
          if [[ "$APPROVED_MODEL" == nvidia/nemotron-3-nano-omni-30b-a3b-reasoning ]]; then
            audio_flags+=(--allow-cloud-synthetic-wav)
          fi
          python -u -m scripts.run_nvidia_native_trial --model-id "$APPROVED_MODEL" "${audio_flags[@]}" \
            --integrated-editor-source "$ZX7_INTEGRATED_NATIVE_EDITOR" \
            --workspace "$RUNNER_TEMP/zx7-nvidia-native-trial" \
            --xvfb-binary /usr/bin/Xvfb --display 127.0.0.1:95 \
            --audiovisual-trial --allow-cloud-audio-diagnostics
      - name: Independently confirm original and cumulative editor code unchanged
        if: always()
        run: |
          test "$(git -C third_party/velorn rev-parse HEAD)" = "b3c02adbd5c0779feb8abf34978299e9502cc0e7"
          git -C third_party/velorn diff --exit-code HEAD --
          if [[ -n "${ZX7_INTEGRATED_NATIVE_EDITOR:-}" ]]; then
            expected=$(python -c 'import json;print(json.load(open("studio_next/editor_runtime/source-lock.json"))["loss_aware_extract_revision"])')
            test "$(git -C "$ZX7_INTEGRATED_NATIVE_EDITOR" rev-parse HEAD)" = "$expected"
            git -C "$ZX7_INTEGRATED_NATIVE_EDITOR" diff --exit-code HEAD --
          fi
      - name: Preserve only allowed synthetic media, editable native projects and redacted journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-real-nvidia-native-creative-${{ github.sha }}
          # Never upload the entire Electron profile. Prior public trials
          # inadvertently retained Chromium Cookies, Cache, GPUCache and local
          # storage under state/. Those files are not creative evidence and
          # could contain browsing/session data in a real owner environment.
          # The only cloud-approved source is this trial's generated footage.
          path: |
            ${{ runner.temp }}/zx7-nvidia-native-trial/host-grants.json
            ${{ runner.temp }}/zx7-nvidia-native-trial/brief.txt
            ${{ runner.temp }}/zx7-nvidia-native-trial/source-ledger.json
            ${{ runner.temp }}/zx7-nvidia-native-trial/native-evaluation.json
            ${{ runner.temp }}/zx7-nvidia-native-trial/native-journal.jsonl
            ${{ runner.temp }}/zx7-nvidia-native-trial/native-client-stdout.txt
            ${{ runner.temp }}/zx7-nvidia-native-trial/native-client-stderr.txt
            ${{ runner.temp }}/zx7-nvidia-native-trial/staging/original-neutral-gradient.mp4
            ${{ runner.temp }}/zx7-nvidia-native-trial/staging/original-synthetic-sound.wav
            ${{ runner.temp }}/zx7-nvidia-native-trial/outputs/*.mp4
            ${{ runner.temp }}/zx7-nvidia-native-trial/projects/**/*.comfystudio
            ${{ runner.temp }}/zx7-nvidia-native-trial/projects/**/assets/video/*.mp4
            ${{ runner.temp }}/zx7-nvidia-native-trial/projects/**/assets/audio/*.wav
            ${{ runner.temp }}/zx7-nvidia-native-trial/projects/**/project.thumbnail.webp
            ${{ runner.temp }}/zx7-nvidia-native-trial/state/av-project-snapshots/*.comfystudio
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 7
