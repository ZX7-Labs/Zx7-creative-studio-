name: ZX7 Native Scene Collaboration — Revision Candidate

on:
  pull_request:
    paths:
      - 'engines/velorn/native-scene-revision.patch'
      - 'engines/velorn/prepare-native-scene-candidate.sh'
      - 'engines/velorn/mcp-e2e.py'
      - 'studio_next/native_creative_revision.py'
      - 'studio_next/test_native_creative_revision.py'
      - 'studio_next/editor_runtime/source-lock.json'
      - 'studio_next/native_editor_identity.py'
      - 'studio_next/native_editor_source_pin.py'
      - 'studio_next/body_editor_mcp.py'
      - 'studio_next/test_native_scene_revision.py'
      - 'scripts/install-zx7-linux.sh'
      - 'engines/velorn/README.md'
      - '.github/workflows/zx7-native-scene-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify candidate installer syntax before installing anything
        run: bash -n scripts/install-zx7-linux.sh
      - name: Verify previous source and new deterministic scene patch
        run: |
          set -euo pipefail
          bash engines/velorn/prepare-native-scene-candidate.sh \
            "$GITHUB_WORKSPACE/third_party/velorn" \
            "$RUNNER_TEMP/zx7-native-scene" --inspect
          test ! -e "$RUNNER_TEMP/zx7-native-scene"

  installed-scene-collaboration:
    needs: inspect-source
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install actual Electron X11 and picture/audio decoders
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg unzip xvfb xauth xdotool x11-xkb-utils xkb-data \
            libnss3 libatk-bridge2.0-0 libasound2t64 libgtk-3-0 \
            libgbm1 libxss1 libxdamage1 libxcomposite1 libxrandr2 libx11-xcb1
          python -m pip install --no-cache-dir '.[editor,production]'
      - name: Prove reproducible opted-in scene build and source identity
        run: |
          editor="$RUNNER_TEMP/zx7-native-scene"
          bash engines/velorn/prepare-native-scene-candidate.sh \
            "$GITHUB_WORKSPACE/third_party/velorn" "$editor" --install
          expected=$(python -c 'import json;print(json.load(open("studio_next/editor_runtime/source-lock.json"))["collab_scene_revision"])')
          test "$(git -C "$editor" rev-parse HEAD)" = "$expected"
          git -C "$editor" diff --exit-code HEAD --
          echo "ZX7_SCENE_EDITOR=$editor" >> "$GITHUB_ENV"
      - name: Build exact Electron desktop scene variant
        run: |
          cd "$ZX7_SCENE_EDITOR"
          bash "$GITHUB_WORKSPACE/engines/velorn/install-ci-dependencies.sh" supported-electron
          npm run build
          test -s dist/index.html
          helper="$PWD/node_modules/electron/dist/chrome-sandbox"
          test -f "$helper"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          test "$(xvfb-run -a node_modules/electron/dist/electron --version)" = "v45.2.3"
      - name: Actual shape and keyframe GUI conflict, native save, A/V, restart
        run: |
          python -u engines/velorn/mcp-e2e.py \
            --source "$ZX7_SCENE_EDITOR" \
            --xvfb-binary /usr/bin/Xvfb \
            --display 127.0.0.1:97
      - name: Verify original pinned submodule unchanged
        if: always()
        run: |
          test "$(git -C third_party/velorn rev-parse HEAD)" = "b3c02adbd5c0779feb8abf34978299e9502cc0e7"
          git -C third_party/velorn diff --exit-code HEAD --
