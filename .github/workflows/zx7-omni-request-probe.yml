name: ZX7 bounded Omni request compatibility check
on:
  push:
    branches: [trial/g1-synthetic-omni-20261118]
permissions:
  contents: read
jobs:
  synthetic-text:
    if: github.event.head_commit.message == 'Measure synthetic Omni protocol once'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Compare two synthetic one-function requests
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from urllib.parse import urlparse
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args): raise RuntimeError("redirect refused")
          opener=urllib.request.build_opener(NoRedirect())
          for choice in ("required","auto"):
              p=dict(model="nvidia/nemotron-3-nano-omni-30b-a3b-reasoning", messages=[dict(role="user",content="Call ready once.")],tools=[dict(type="function",function=dict(name="ready",description="Report ready",parameters=dict(type="object",properties={})))],tool_choice=choice,parallel_tool_calls=False,temperature=0.2,max_tokens=256,stream=False,chat_template_kwargs=dict(enable_thinking=False))
              req=urllib.request.Request("https://integrate.api.nvidia.com/v1/chat/completions",data=json.dumps(p).encode(),headers={"Content-Type":"application/json","Authorization":"Bearer "+os.environ["NVIDIA_API_KEY"]})
              try:
                  with opener.open(req,timeout=65) as response:
                      result=json.load(response)
                      print(choice,response.status,"tool response",bool(result["choices"][0]["message"].get("tool_calls")))
              except urllib.error.HTTPError as exc:
                  body=exc.read(8192).lower()
                  labels=[v for v in ("tool_choice","parallel_tool_calls","chat_template_kwargs","max_tokens","tool calling","not supported","not found","not available","not enabled","function calling","invalid model","unsupported","unknown model","does not support") if v.encode() in body]
                  print(choice,exc.code,"provider diagnostic categories",labels)
                  if exc.code!=400: break
          PY
