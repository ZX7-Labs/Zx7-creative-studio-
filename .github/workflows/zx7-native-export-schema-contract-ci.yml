name: ZX7 host-scoped export ABI and real editor contract
on:
  push:
    branches: [engineering/host-observed-asset-frontier-20261108]
    paths:
      - ".github/workflows/zx7-native-export-schema-contract-ci.yml"
      - "studio_next/body_editor_mcp.py"
      - "studio_next/test_body_editor_mcp.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mandatory-export-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          test "$(git -C third_party/velorn rev-parse HEAD)" = "b3c02adbd5c0779feb8abf34978299e9502cc0e7"
          node --test engines/velorn/native-marker-preview.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --no-cache-dir '.[production,editor]'
      - name: Compile and run exact host/MCP/provider/controller contract tests
        run: |
          python -m compileall -q studio_next/body_editor_mcp.py studio_next/test_body_editor_mcp.py
          python -m unittest -v studio_next.test_body_editor_mcp studio_next.test_body_editor_policy studio_next.test_body_editor_client studio_next.test_native_creative_control studio_next.test_native_creative_audit studio_next.test_nvidia_native_tool_model scripts.test_run_nvidia_native_trial
