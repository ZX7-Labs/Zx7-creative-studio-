name: ZX7 Native Editorial Collaboration — Source-Pinned Runtime

on:
  pull_request:
    paths:
      - 'engines/velorn/native-editorial-revision.patch'
      - 'engines/velorn/prepare-native-editorial-candidate.sh'
      - 'studio_next/editor_runtime/source-lock.json'
      - 'studio_next/editor_runtime/launcher.mjs'
      - 'studio_next/native_editor_source_pin.py'
      - 'studio_next/native_editor_identity.py'
      - 'studio_next/capability_gateway.py'
      - 'studio_next/test_native_editorial_revision.py'
      - 'engines/velorn/mcp-e2e.py'
      - 'engines/velorn/native-pointer-geometry.mjs'
      - 'engines/velorn/native_pointer_proof.py'
      - 'studio_next/editor_runtime/mcp.mjs'
      - 'studio_next/test_native_pointer_proof.py'
      - 'scripts/install-zx7-linux.sh'
      - '.github/workflows/zx7-native-editorial-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify editorial patch applies to exact clean source-pinned scene
        run: |
          set -euo pipefail
          bash -n scripts/install-zx7-linux.sh
          node --check engines/velorn/native-pointer-geometry.mjs
          node --check studio_next/editor_runtime/mcp.mjs
          node --check studio_next/editor_runtime/launcher.mjs
          bash -n engines/velorn/prepare-native-editorial-candidate.sh
          bash engines/velorn/prepare-native-editorial-candidate.sh \
            "$GITHUB_WORKSPACE/third_party/velorn" \
            "$RUNNER_TEMP/zx7-native-editorial" --inspect
          test ! -e "$RUNNER_TEMP/zx7-native-editorial"

  installed-editorial-collaboration:
    needs: inspect-source
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install native Electron, X11, independent A/V decoders, and BODY
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg unzip xvfb xauth xdotool x11-xkb-utils xkb-data \
            libnss3 libatk-bridge2.0-0 libasound2t64 libgtk-3-0 \
            libgbm1 libxss1 libxdamage1 libxcomposite1 libxrandr2 libx11-xcb1
          python -m pip install --no-cache-dir '.[editor,production]'
      - name: Source-independent native editorial writer threat tests
        run: |
          python -m unittest \
            studio_next.test_native_editorial_revision \
            studio_next.test_native_pointer_proof \
            studio_next.test_native_revision_fence \
            studio_next.test_native_scene_revision -v
      - name: Install reviewed editorial Git source variant into isolated root
        run: |
          editor="$RUNNER_TEMP/zx7-native-editorial"
          bash engines/velorn/prepare-native-editorial-candidate.sh \
            "$GITHUB_WORKSPACE/third_party/velorn" "$editor" --install
          expected=$(python -c 'import json;print(json.load(open("studio_next/editor_runtime/source-lock.json"))["collab_editorial_revision"])')
          test "$(git -C "$editor" rev-parse HEAD)" = "$expected"
          git -C "$editor" diff --exit-code HEAD --
          echo "ZX7_EDITORIAL_EDITOR=$editor" >> "$GITHUB_ENV"
      - name: Build and attest actual Electron desktop with original native source
        run: |
          cd "$ZX7_EDITORIAL_EDITOR"
          bash "$GITHUB_WORKSPACE/engines/velorn/install-ci-dependencies.sh" supported-electron
          npm run build
          test -s dist/index.html
          helper="$PWD/node_modules/electron/dist/chrome-sandbox"
          test -f "$helper"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          test "$(xvfb-run -a node_modules/electron/dist/electron --version)" = "v45.2.3"
      - name: Real human GUI action vs ten editorial native writers, save, independent A/V, reopen
        run: |
          python -u engines/velorn/mcp-e2e.py \
            --source "$ZX7_EDITORIAL_EDITOR" \
            --xvfb-binary /usr/bin/Xvfb \
            --display 127.0.0.1:97
      - name: Verify untouched original editor submodule
        if: always()
        run: |
          test "$(git -C third_party/velorn rev-parse HEAD)" = "b3c02adbd5c0779feb8abf34978299e9502cc0e7"
          git -C third_party/velorn diff --exit-code HEAD --
