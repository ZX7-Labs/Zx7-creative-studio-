name: ZX7 Owner — Unified Installed Creative Tools (Offline)

on:
  pull_request:
    paths:
      - '.github/workflows/zx7-owner-unified-creative-tools.yml'
      - 'studio_next/native_editor_session.py'
      - 'studio_next/studio_cli.py'
      - 'studio_next/test_owner_body_tools.py'
      - 'studio_next/test_studio_cli.py'
      - 'studio_next/body_capability_adapter.py'
      - 'studio_next/capability_gateway.py'
      - 'studio_next/capability_mcp_session.py'
      - 'engines/velorn/unified-owner-e2e.py'
      - 'studio_next/body_motion_project.py'
      - 'studio_next/body_motion_worker.py'
      - 'studio_next/body_motion_proof.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-owned-unified-gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local physical media decoder and real BODY pixel engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --no-cache-dir '.[editor,production]' numpy Pillow
          ffmpeg -version | head -n 1
      - name: Prove shared actual installed BODY catalog + native editor contracts
        run: |
          set -euo pipefail
          python -m py_compile studio_next/native_editor_session.py \
            studio_next/studio_cli.py studio_next/test_owner_body_tools.py \
            studio_next/test_studio_cli.py
          python -m unittest studio_next.test_owner_body_tools \
            studio_next.test_studio_cli \
            studio_next.test_body_capability_adapter \
            studio_next.test_capability_mcp_session -v
          test -z "${NVIDIA_API_KEY:-}"

  real-native-creative-handoff:
    needs: host-owned-unified-gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install actual sandboxed Linux Electron, media and BODY dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg unzip xvfb xauth xdotool x11-xkb-utils xkb-data \
            libnss3 libatk-bridge2.0-0 libasound2t64 libgtk-3-0 \
            libgbm1 libxss1 libxdamage1 libxcomposite1 libxrandr2 libx11-xcb1
          python -m pip install --no-cache-dir '.[editor,production]' numpy Pillow
      - name: Rebuild and attest the same loss-aware native CGI/audio/editorial source
        run: |
          set -euo pipefail
          editor="$RUNNER_TEMP/zx7-owner-unified-source"
          bash engines/velorn/prepare-native-loss-aware-extract-candidate.sh \
            "$GITHUB_WORKSPACE/third_party/velorn" "$editor" --install
          expected=$(python -c 'import json;print(json.load(open("studio_next/editor_runtime/source-lock.json"))["loss_aware_extract_revision"])')
          test "$(git -C "$editor" rev-parse HEAD)" = "$expected"
          git -C "$editor" diff --exit-code HEAD --
          echo "ZX7_UNIFIED_EDITOR=$editor" >> "$GITHUB_ENV"
          cd "$editor"
          bash "$GITHUB_WORKSPACE/engines/velorn/install-ci-dependencies.sh" supported-electron
          npm run build
          test -s dist/index.html
          helper="$PWD/node_modules/electron/dist/chrome-sandbox"
          test -f "$helper"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          test "$(xvfb-run -a node_modules/electron/dist/electron --version)" = "v45.2.3"
      - name: Install exact native Blender 4.5 LTS and authenticate official archive bytes
        run: |
          set -euo pipefail
          version=4.5.16
          base="https://mirror.blender.org/release/Blender4.5"
          temp="$RUNNER_TEMP/zx7-blender-lts"
          mkdir -p "$temp"
          curl --fail --location --retry 3 --connect-timeout 20 \
            --output "$temp/blender-$version.sha256" "$base/blender-$version.sha256"
          curl --fail --location --retry 3 --connect-timeout 20 \
            --output "$temp/blender-$version-linux-x64.tar.xz" \
            "$base/blender-$version-linux-x64.tar.xz"
          checksum=$(awk -v file="blender-$version-linux-x64.tar.xz" \
            '$2 == file || $2 == "*" file {print $1}' "$temp/blender-$version.sha256")
          test "${#checksum}" = 64
          printf '%s  %s\n' "$checksum" "$temp/blender-$version-linux-x64.tar.xz" \
            | sha256sum --check --status
          tar -xJf "$temp/blender-$version-linux-x64.tar.xz" -C "$temp"
          binary="$temp/blender-$version-linux-x64/blender"
          test -x "$binary"
          test "$("$binary" --version | head -n 1)" = "Blender 4.5.16 LTS"
          echo "$temp/blender-$version-linux-x64" >> "$GITHUB_PATH"
      - name: Verify same original Blender/graph/sound native timeline, source-safe A/V ripple, two exports and fresh reopen
        run: |
          python -m py_compile engines/velorn/unified-owner-e2e.py
          python -u engines/velorn/unified-owner-e2e.py \
            --source "$ZX7_UNIFIED_EDITOR" \
            --xvfb-binary /usr/bin/Xvfb \
            --display 127.0.0.1:96 --with-blender --with-atomic-range \
            --evidence-out "$GITHUB_WORKSPACE/output/g1-native-synthetic"
      - name: Independently rehash and structurally validate exact synthetic native delivery
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("output/g1-native-synthetic")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["schema"] == 1
          assert manifest["kind"] == "zx7_synthetic_native_blender_graph_av_revision"
          assert manifest["synthetic_only"] is True
          assert manifest["scripted_engine_decisions_not_neural"] is True
          assert manifest["genuine_model_artistry_verified"] is False
          assert manifest["independent_professional_review"] is False
          assert manifest["first_and_revised_render_snapshots_sha_verified"] is True
          actual = set()
          for item in manifest["files"]:
              name = item["file"]
              assert name not in actual and "/" not in name and "\\" not in name
              actual.add(name)
              target = root / name
              assert target.is_file() and not target.is_symlink()
              assert item["bytes"] == target.stat().st_size > 0
              sha = hashlib.sha256()
              with target.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      sha.update(chunk)
              assert item["sha256"] == sha.hexdigest(), name
          assert len(actual) == 11
          assert {p.name for p in root.iterdir()} == actual | {"manifest.json"}
          print("ZX7_SYNTHETIC_NATIVE_DELIVERY_VERIFIED", len(actual), "source and A/V files")
          PY
      - name: Preserve verified synthetic source, editable project, and both physical A/V renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-g1-native-editable-synthetic-${{ github.sha }}
          path: output/g1-native-synthetic/
          if-no-files-found: warn
          retention-days: 7
      - name: Never mutate original checked-out editor or pinned child
        if: always()
        run: |
          test "$(git -C third_party/velorn rev-parse HEAD)" = "b3c02adbd5c0779feb8abf34978299e9502cc0e7"
          git -C third_party/velorn diff --exit-code HEAD --
          if [[ -n "${ZX7_UNIFIED_EDITOR:-}" ]]; then
            git -C "$ZX7_UNIFIED_EDITOR" diff --exit-code HEAD --
          fi
