name: ZX7 one-use source-bound sound discrimination without tool grammar
on:
  push:
    branches: [trial/g1-omni-audio-observation-no-tools-20261125]
    paths: ['.github/workflows/zx7-oneuse-omni-audio-observation-no-tools-20261125.yml']
permissions:
  contents: read
concurrency:
  group: zx7-omni-audio-observation-no-tools-20261125
  cancel-in-progress: false
jobs:
  probe:
    if: github.run_attempt == 1 && github.ref == 'refs/heads/trial/g1-omni-audio-observation-no-tools-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify reviewed exact synthetic-only scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "19e0dabeec2ed609a5588d63b2e766b7364dc44f"
          test "$(git diff --name-only HEAD^ HEAD | LC_ALL=C sort)" = "$(printf '%s\n' '.github/workflows/zx7-oneuse-omni-audio-observation-no-tools-20261125.yml' 'research/nvidia-omni-audio-observation-no-tools-20261125.json' | LC_ALL=C sort)"
          git diff --check HEAD^ HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare bounded original sound evidence without provider credentials
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffmpeg
          python -m pip install --disable-pip-version-check --no-cache-dir '.[editor]'
          python - <<'PY'
          import math, wave, struct, hashlib, json, os, subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'zx7-audio-probe'
          root.mkdir(mode=0o700)
          assert not os.environ.get('NVIDIA_API_KEY')
          records=[]
          for index, frequencies in enumerate(((220,880),(880,220),(330,660),(660,330))):
              raw=root/f'original-{index}.wav'
              export=root/f'export-{index}.mp4'
              decoded=root/f'decoded-{index}.wav'
              # Same duration, sample rate, amplitude, timing and envelope;
              # only the first/second note's pitch is reversed.
              with wave.open(str(raw),'wb') as f:
                  f.setnchannels(1);f.setsampwidth(2);f.setframerate(48000)
                  samples=[]
                  for n in range(96000):
                      local=n%48000;freq=frequencies[n//48000]
                      fade=min(1,local/240,(47999-local)/240)
                      samples.append(round(10000*fade*math.sin(2*math.pi*freq*local/48000)))
                  f.writeframes(struct.pack('<'+'h'*len(samples),*samples))
              subprocess.run(['ffmpeg','-v','error','-f','lavfi','-i','color=c=black:s=320x180:r=24:d=2','-i',str(raw),'-c:v','libx264','-c:a','aac','-shortest',str(export)],check=True,timeout=30)
              subprocess.run(['ffmpeg','-v','error','-i',str(export),'-map','0:a:0','-t','2','-ar','16000','-ac','1','-c:a','pcm_s16le',str(decoded)],check=True,timeout=30)
              with wave.open(str(decoded),'rb') as f:
                  assert f.getnchannels()==1 and f.getframerate()==16000 and f.getsampwidth()==2
                  duration=f.getnframes()/f.getframerate()
              assert 1.95 <= duration <= 2.05
              payload=decoded.read_bytes()
              assert len(payload)<=128*1024
              records.append({'id':index,'expected':'low_then_high' if frequencies[0]<frequencies[1] else 'high_then_low','wav':decoded.name,'export':export.name,'evidence':{'wav_sha256':hashlib.sha256(payload).hexdigest(),'export_sha256':hashlib.sha256(export.read_bytes()).hexdigest(),'requested_start_seconds':0.0,'requested_duration_seconds':2.0,'observed_audio_duration_seconds':duration,'preview_downmixed_and_resampled':True,'exact_original_audio_pts_proven':False}})
          (root/'input-receipts.json').write_text(json.dumps(records,indent=2))
          PY
      - name: Four genuine source-bound audio observations without function grammar
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, hashlib, time, re
          from pathlib import Path
          from studio_next.nvidia_model import NvidiaModelSettings, NvidiaConfigurationError, NvidiaTransportError
          from studio_next.nvidia_native_tool_model import NvidiaUniformWrappedOmniNativeToolCreativeModel
          req=json.loads(Path('research/nvidia-omni-audio-observation-no-tools-20261125.json').read_text())
          assert req == json.loads('{"schema":1,"kind":"synthetic-source-bound-audio-no-tools-discrimination","request_id":"ZX7_OMNI_AUDIO_OBSERVATION_NO_TOOLS_20261125","source":"19e0dabeec2ed609a5588d63b2e766b7364dc44f","model":"nvidia/nemotron-3-nano-omni-30b-a3b-reasoning","max_total_calls":4,"max_tokens_per_call":512,"synthetic_only":true,"cloud_synthetic_wav_allowed":true,"private_media_allowed":false,"native_dispatch_allowed":false,"run_authorized":true,"control_run":45565428743}')
          root=Path(os.environ['RUNNER_TEMP'])/'zx7-audio-probe'
          records=json.loads((root/'input-receipts.json').read_text())
          assert len(records)==req['max_total_calls']==4
          model=NvidiaUniformWrappedOmniNativeToolCreativeModel(
              NvidiaModelSettings(model_id=req['model'],max_tokens=512,timeout_seconds=90,
                sampling={'temperature':0.2,'chat_template_kwargs':{'enable_thinking':False}}),
              system_prompt='Listen to the actual two-second original sound excerpt. Decide whether the first note is lower or higher in pitch than the second. Output exactly one label: low_then_high, high_then_low, or unclear. Do not infer from hashes or metadata. If unclear choose unclear. This is a synthetic perception test, no editor operation is executed.',
              allow_original_audio_upload=True)
          results=[]
          allowed={'low_then_high','high_then_low','unclear'}
          for row in records:
              raw=(root/row['wav']).read_bytes()
              evidence=row['evidence']
              assert hashlib.sha256(raw).hexdigest()==evidence['wav_sha256']
              assert hashlib.sha256((root/row['export']).read_bytes()).hexdigest()==evidence['export_sha256']
              context={'audio_evidence':evidence,'synthetic_fixture_not_live_editor':True}
              # Reuse the exact production consent, custody, WAV and transport
              # validators. Only remove provider tool grammar for this controlled
              # read-only experiment, without enabling a single native action.
              messages=model._messages_with_audio(context,(),[('audio/wav',raw)])
              payload={'model':req['model'],'stream':False,'response_format':{'type':'json_object'},'messages':messages}
              payload.update(model.settings.sampling)
              started=time.monotonic()
              try:
                  with model._open_request(payload) as response:
                      body=response.read(model.settings.max_response_bytes+1)
                  if len(body)>model.settings.max_response_bytes: raise ValueError('oversize')
                  result=json.loads(body)
                  choices=result.get('choices')
                  if not isinstance(choices,list) or len(choices)!=1: raise ValueError('choices')
                  message=choices[0].get('message',{})
                  if message.get('tool_calls'): raise ValueError('unexpected tool call')
                  content=message.get('content')
                  answer=content.strip() if isinstance(content,str) else None
                  status='PASS' if answer==row['expected'] else 'WRONG_OR_UNCLEAR'
                  receipt={'status':status,'answer':answer if answer in allowed else None}
                  usage=result.get('usage',{})
                  receipt['usage']={k:usage[k] for k in ('prompt_tokens','completion_tokens','total_tokens') if isinstance(usage,dict) and type(usage.get(k)) is int and 0<=usage[k]<=1_000_000_000}
              except (NvidiaConfigurationError,NvidiaTransportError,ValueError,TypeError,KeyError) as exc:
                  http=re.search(r"HTTP (\d{3})",str(exc))
                  receipt={'status':'ERROR','type':type(exc).__name__,'http':int(http.group(1)) if http else None}
              receipt.update(case=row['id'],expected=row['expected'],elapsed_s=round(time.monotonic()-started,3),wav_sha256=evidence['wav_sha256'],export_sha256=evidence['export_sha256'])
              results.append(receipt)
              print('ZX7_AUDIO_NO_TOOLS_CASE',json.dumps(receipt),flush=True)
          summary={'results':results,'native_dispatches':0,'creative_semantic_audio_review_verified':False,'synthetic_only':True,'provider_calls_at_most':4}
          (root/'audio-probe-result.json').write_text(json.dumps(summary,indent=2))
          print('ZX7_AUDIO_NO_TOOLS_RESULT',json.dumps(summary))
          if not all(x['status']=='PASS' for x in results): raise SystemExit(1)
          PY
      - name: Retain synthetic original and decoded sound evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-omni-audio-observation-no-tools-${{ github.sha }}
          path: ${{ runner.temp }}/zx7-audio-probe/
          retention-days: 7
          if-no-files-found: warn
