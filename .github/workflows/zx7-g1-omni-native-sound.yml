name: ZX7 G1 — Consent-Gated Original Sound to Omni (Offline)

on:
  pull_request:
    branches: [main]
    paths:
      - 'studio_next/native_creative_control.py'
      - 'studio_next/native_editor_session.py'
      - 'studio_next/nvidia_native_tool_model.py'
      - 'studio_next/studio_cli.py'
      - 'studio_next/test_native_audio_model_input.py'
      - 'studio_next/test_nvidia_native_tool_model.py'
      - '.github/workflows/zx7-g1-omni-native-sound.yml'
  push:
    branches: [main]
    paths:
      - 'studio_next/native_creative_control.py'
      - 'studio_next/native_editor_session.py'
      - 'studio_next/nvidia_native_tool_model.py'
      - 'studio_next/studio_cli.py'
      - '.github/workflows/zx7-g1-omni-native-sound.yml'

permissions:
  contents: read

jobs:
  source-bound-omni-transport-no-hosted-spend:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local declared native BODY dependency
        run: python -m pip install --no-cache-dir '.[editor]'
      - name: Compile source and audio-control tests
        run: |
          python -m py_compile studio_next/native_creative_control.py studio_next/native_editor_session.py studio_next/nvidia_native_tool_model.py studio_next/studio_cli.py studio_next/test_native_audio_model_input.py studio_next/test_nvidia_native_tool_model.py
      - name: Verify RAW sound bytes stay default-denied and source-bound
        run: |
          python -m unittest -v \
            studio_next.test_native_audio_model_input \
            studio_next.test_nvidia_native_tool_model \
            studio_next.test_native_creative_control
