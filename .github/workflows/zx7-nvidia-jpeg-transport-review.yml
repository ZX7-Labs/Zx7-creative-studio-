name: ZX7 NVIDIA synthetic JPEG transport proof
on:
  push:
    branches: [engineering/host-observed-asset-frontier-20261108]
    paths:
      - ".github/workflows/zx7-nvidia-jpeg-transport-review.yml"
      - "studio_next/test_nvidia_native_tool_model.py"
      - "studio_next/nvidia_native_tool_model.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-native-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared provider dependencies
        run: python -m pip install --no-cache-dir '.[production,editor]'
      - name: Compile provider source
        run: python -m compileall -q studio_next/nvidia_native_tool_model.py studio_next/nvidia_tool_model.py studio_next/test_nvidia_native_tool_model.py
      - name: Run actual typed function and JPEG provenance transport tests without cloud key
        run: |
          python -m unittest -v studio_next.test_nvidia_native_tool_model studio_next.test_nvidia_tool_model studio_next.test_nvidia_model
