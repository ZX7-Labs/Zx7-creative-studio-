name: ZX7 one-use observed asset contract regression and model comparison
on:
  push:
    branches: [trial/g1-observed-asset-contract-model-comparison-20261125]
    paths: ['.github/workflows/zx7-oneuse-observed-asset-contract-model-comparison-20261125.yml']
permissions:
  contents: read
concurrency:
  group: zx7-observed-asset-contract-comparison-20261125
  cancel-in-progress: false
jobs:
  regression:
    if: github.run_attempt == 1 && github.ref == 'refs/heads/trial/g1-observed-asset-contract-model-comparison-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 4
          submodules: recursive
      - name: Verify exact two-file experiment and red-green ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "19e0dabeec2ed609a5588d63b2e766b7364dc44f"
          test "$(git rev-parse HEAD^^)" = "06efea5afed5c3c121e28ec75d33e88d8c212fbd"
          test "$(git rev-parse HEAD^^^)" = "54a77310441cd655de6d066ea26a17c0fc50e8f7"
          test "$(git diff --name-only HEAD^ HEAD | LC_ALL=C sort)" = "$(printf '%s\n' '.github/workflows/zx7-oneuse-observed-asset-contract-model-comparison-20261125.yml' 'research/nvidia-observed-asset-contract-model-comparison-20261125.json' | LC_ALL=C sort)"
          test "$(git -C third_party/velorn rev-parse HEAD)" = "b3c02adbd5c0779feb8abf34978299e9502cc0e7"
          git diff --check HEAD^^^ HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir '.[editor,production]'
      - name: Prove the new contract test fails against the previous implementation
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/red" "06efea5afed5c3c121e28ec75d33e88d8c212fbd"
          cd "$RUNNER_TEMP/red"
          if python -m unittest studio_next.test_native_creative_control.NativeCreativeControlTests.test_full_native_provider_gets_attested_imported_asset_ids_without_dispatch -v > "$RUNNER_TEMP/red.log" 2>&1; then
            cat "$RUNNER_TEMP/red.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/red.log"
          grep -F "KeyError: 'enum'" "$RUNNER_TEMP/red.log"
          grep -F "test_full_native_provider_gets_attested_imported_asset_ids_without_dispatch" "$RUNNER_TEMP/red.log"
      - name: Verify actual changed runtime and adjacent contracts
        run: |
          python -m unittest studio_next.test_native_creative_control studio_next.test_nvidia_native_tool_model studio_next.test_body_editor_policy scripts.test_nvidia_av_trial_request -v
  route:
    needs: regression
    if: github.run_attempt == 1 && github.ref == 'refs/heads/trial/g1-observed-asset-contract-model-comparison-20261125'
    strategy:
      fail-fast: false
      matrix:
        model: ['nvidia/nemotron-3-nano-omni-30b-a3b-reasoning', 'nvidia/nemotron-3-ultra-550b-a55b', 'nvidia/nemotron-3.5-super-vl-120b-a12b']
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          submodules: recursive
      - name: Verify source and extract exact pinned tool declarations
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "19e0dabeec2ed609a5588d63b2e766b7364dc44f"
          test "$(git -C third_party/velorn rev-parse HEAD)" = "b3c02adbd5c0779feb8abf34978299e9502cc0e7"
          test "$(git diff --name-only HEAD^ HEAD | LC_ALL=C sort)" = "$(printf '%s\n' '.github/workflows/zx7-oneuse-observed-asset-contract-model-comparison-20261125.yml' 'research/nvidia-observed-asset-contract-model-comparison-20261125.json' | LC_ALL=C sort)"
          git diff --check HEAD^ HEAD
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const source = fs.readFileSync('third_party/velorn/electron/mcpServer.js','utf8');
          const expected = {"get_project":"{\n        type: 'object',\n        properties: {},\n      }","import_asset_from_path":"{\n        type: 'object',\n        properties: {\n          path: { type: 'string', description: 'Absolute local file path to import — or a directory / any numbered frame of an image sequence.' },\n          filePath: { type: 'string', description: 'Alias for path.' },\n          sourcePath: { type: 'string', description: 'Alias for path.' },\n          asSequence: { type: 'boolean', description: 'true forces sequence import (errors if no run is found); false disables detection and imports the single file. Omit for auto-detect.' },\n          fps: { type: 'number', description: 'Sequence frame rate. Defaults to the project rate; recorded in the asset\\'s sequenceSource tag for later re-interpretation.' },\n          category: { type: 'string', enum: ['video', 'audio', 'images', 'image'], description: 'Optional category for single-file imports. If omitted, inferred from extension.' },\n          folderId: { type: 'string', description: 'Optional existing asset folder ID for the imported asset.' },\n          folderPath: { oneOf: [{ type: 'string' }, { type: 'array', items: { type: 'string' } }], description: 'Optional folder path to create/reuse before assigning the imported asset.' },\n          folderName: { type: 'string', description: 'Single folder name alias for folderPath.' },\n          previewOnly: { type: 'boolean', description: 'When true, returns the import plan without copying the file. Defaults to true.' },\n        },\n      }","add_asset_to_timeline":"{\n        type: 'object',\n        properties: {\n          assetId: {\n            type: 'string',\n            description: 'Project asset ID to place. If omitted, assetName or the latest placeable asset is used.',\n          },\n          assetName: {\n            type: 'string',\n            description: 'Exact or partial asset name to place.',\n          },\n          latestGenerated: {\n            type: 'boolean',\n            description: 'When true, place the most recent matching generated/placeable asset.',\n          },\n          latest: {\n            type: 'boolean',\n            description: 'Alias for latestGenerated.',\n          },\n          type: {\n            type: 'string',\n            enum: ['video', 'image', 'audio'],\n            description: 'Optional asset type filter when resolving by name/latest.',\n          },\n          assetType: {\n            type: 'string',\n            enum: ['video', 'image', 'audio'],\n            description: 'Alias for type.',\n          },\n          workflowId: {\n            type: 'string',\n            description: 'Optional workflow id filter when resolving the latest generated asset, for example ltx23-i2v.',\n          },\n          trackId: {\n            type: 'string',\n            description: 'Optional compatible target track ID. Video/image assets require a video track; audio assets require an audio track.',\n          },\n          createTrack: {\n            type: 'boolean',\n            description: 'When true, create a new compatible track before placing the asset. Video tracks are created at the top.',\n          },\n          newTrack: {\n            type: 'boolean',\n            description: 'Alias for createTrack.',\n          },\n          trackName: {\n            type: 'string',\n            description: 'Optional name for the new track when createTrack/newTrack is true.',\n          },\n          trackStrategy: {\n            type: 'string',\n            enum: ['existing', 'new', 'newTopTrack'],\n            description: 'Optional track strategy. Use newTopTrack to compare generated variations on separate upper video layers.',\n          },\n          startSeconds: {\n            type: 'number',\n            description: 'Absolute timeline start time in seconds. Defaults to the playhead.',\n          },\n          startTime: {\n            type: 'number',\n            description: 'Alias for startSeconds.',\n          },\n          at: {\n            type: 'string',\n            enum: ['playhead', 'selected_clip_start', 'selected_clip_end', 'timeline_end', 'track_end'],\n            description: 'Placement shortcut when startSeconds is omitted.',\n          },\n          placement: {\n            type: 'string',\n            description: 'Alias for at.',\n          },\n          durationSeconds: {\n            type: 'number',\n            description: 'Optional timeline duration. Defaults to 5 seconds for images, or source duration for video/audio when known.',\n          },\n          duration: {\n            type: 'number',\n            description: 'Alias for durationSeconds.',\n          },\n          sourceInSeconds: {\n            type: 'number',\n            description: 'Source-media in point in seconds (video/audio). The clip is born pre-trimmed from here — timeline trim handles can still reveal the rest of the source later.',\n          },\n          sourceOutSeconds: {\n            type: 'number',\n            description: 'Source-media out point in seconds. With sourceInSeconds it defines the inserted range; when durationSeconds is omitted, the clip duration derives from the range.',\n          },\n          resolveOverlaps: {\n            type: 'boolean',\n            description: 'When true, use normal timeline overwrite behavior on the target track. Defaults to true.',\n          },\n          selectAfterAdd: {\n            type: 'boolean',\n            description: 'When true, select the newly added clip. Defaults to true.',\n          },\n          transform: {\n            type: 'object',\n            description: 'Optional initial transform values such as positionX, positionY, scaleX, scaleY, rotation, opacity, blur, motion blur settings, or crop fields.',\n          },\n          includeAudio: {\n            type: 'boolean',\n            description: 'For video assets with embedded audio, also create a linked audio clip on an audio track. Defaults to true.',\n          },\n          includeEmbeddedAudio: {\n            type: 'boolean',\n            description: 'Alias for includeAudio.',\n          },\n          previewOnly: {\n            type: 'boolean',\n            description: 'When true, returns the placement plan without changing the timeline. Defaults to true.',\n          },\n        },\n      }"};
          const specs = {};
          for (const [name, literal] of Object.entries(expected)) {
            const at = source.indexOf("name: '" + name + "',");
            if (at < 0) throw Error('Missing exact native tool: ' + name);
            const end = source.indexOf('\n    },\n    {',at);
            const start = source.indexOf('inputSchema: {',at) + 'inputSchema: '.length;
            const actual = source.slice(start,end).trim().replace(/,$/,'');
            if (actual !== literal) throw Error('Source declaration mismatch: ' + name);
            const schema = vm.runInNewContext('(' + actual + ')', Object.create(null), {timeout:100});
            // Same indexed admission closure and explicit preview choice as BODY
            // for these pinned preview-default writes.
            if (schema.properties && !('additionalProperties' in schema) && !('patternProperties' in schema)) schema.additionalProperties = false;
            if (name !== 'get_project') schema.required = [...new Set([...(schema.required || []),'previewOnly'])];
            specs[name] = {name, description: name === 'get_project' ? 'Read actual project' : name === 'import_asset_from_path' ? 'Import an authorized local media file' : 'Place imported asset on timeline', input_schema:schema};
          }
          fs.writeFileSync('/tmp/zx7-exact-probe-schemas.json',JSON.stringify(specs));
          JS
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir '.[editor]'
      - name: Two real model decisions using recovered synthetic inventory and changed identity
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ZX7_ROUTE_MODEL: ${{ matrix.model }}
        run: |
          python - <<'PY'
          import copy, json, os, re, time
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from studio_next.nvidia_model import NvidiaModelSettings, NvidiaTransportError, NvidiaConfigurationError
          from studio_next.nvidia_native_tool_model import (
              NvidiaNativeToolCreativeModel, NvidiaUniformWrappedOmniNativeToolCreativeModel,
              NVIDIA_OMNI_AUDIO_MODEL_ID, NATIVE_UNIFORM_WRAPPED_TOOL_SYSTEM)
          from studio_next.providers import LocalModelOutputError
          req=json.loads(Path('research/nvidia-observed-asset-contract-model-comparison-20261125.json').read_text())
          assert req == json.loads('{"schema":1,"kind":"synthetic-observed-asset-schema-route-comparison","request_id":"ZX7_OBSERVED_ASSET_CONTRACT_COMPARE_20261125","source":"19e0dabeec2ed609a5588d63b2e766b7364dc44f","upstream_source":"b3c02adbd5c0779feb8abf34978299e9502cc0e7","models":["nvidia/nemotron-3-nano-omni-30b-a3b-reasoning","nvidia/nemotron-3-ultra-550b-a55b","nvidia/nemotron-3.5-super-vl-120b-a12b"],"max_calls_per_model":2,"max_total_calls":6,"max_tokens_per_call":1024,"synthetic_only":true,"private_media_allowed":false,"native_dispatch_allowed":false,"run_authorized":true,"retained_synthetic_run":45626734881,"retained_artifact_sha256":"a9bfc95a7c3c8d032e6cd083f9583a48085afc918d2fb8d83551ee10384c87ac"}')
          model_id=os.environ["ZX7_ROUTE_MODEL"]
          assert model_id in req["models"]
          model_class=(NvidiaUniformWrappedOmniNativeToolCreativeModel
                       if model_id==NVIDIA_OMNI_AUDIO_MODEL_ID else NvidiaNativeToolCreativeModel)
          model=model_class(NvidiaModelSettings(model_id=model_id,max_tokens=1024,timeout_seconds=90,sampling={}),
                            system_prompt=NATIVE_UNIFORM_WRAPPED_TOOL_SYSTEM)
          specs=json.loads(Path('/tmp/zx7-exact-probe-schemas.json').read_text())
          first="asset_1795614443329_ab8oh5zsm"
          cases=[
              ("retained_native_audio", [{"id":first,"name":"original-synthetic-sound.wav","type":"audio"}],
                first, None),
              ("changed_identity_and_decoy", [{"id":"asset_1795614443329_ab8oh5zsm","name":"neutral-gradient.mp4","type":"video"},
                {"id":"asset_1795614443391_n7c2x8m1","name":"original-synthetic-sound.wav","type":"audio"}],
                "asset_1795614443391_n7c2x8m1", first)]
          results=[]
          for i,(label,assets,target,stale) in enumerate(cases):
              offered=["get_project","import_asset_from_path","add_asset_to_timeline"]
              current=copy.deepcopy(specs)
              placement=current["add_asset_to_timeline"]["input_schema"]
              placement["properties"]["assetId"]["enum"]=["",*[x["id"] for x in assets]]
              context={"available_actions":["invoke","search"],"compact_tool_catalog":True,
                       "selectable_native_tools":offered,"inspectable_native_tools":[],
                       "host_native_tool_contracts":[current[n] for n in offered],
                       "creative_brief":"Place the already imported original synthetic sound on the audio timeline at zero using its current explicit asset ID. Apply, not preview. Do not re-import or use the other asset. Choose one valid native function.",
                       "native_placement_assets":{"assets":assets,"count":len(assets),"complete":True,"staged_files_require_import":True},
                       "host_verified_execution_progress":{"project_presence":"present","project_asset_count_from_native_read":len(assets),"active_timeline_clip_count_from_native_read":0},
                       "native_project_presence_from_last_inspection":"present",
                       "synthetic_fixture_not_live_editor":True,
                       "turn":i+5}
              if stale:
                  context["last_rejected_native_action_feedback"]={"tool":"add_asset_to_timeline","rejection_code":"native_reference_not_in_live_inventory","no_native_dispatch":True}
                  context["previous_synthetic_audio_asset_id_no_longer_current"]=stale
              started=time.monotonic()
              try:
                  d=model.decide(context)
                  args=d.get("arguments",{}).get("inputs",{})
                  ok=bool(d.get("action")=="invoke" and d["arguments"].get("tool")=="add_asset_to_timeline"
                          and Draft202012Validator(placement).is_valid(args)
                          and args.get("assetId")==target and args.get("previewOnly") is False
                          and args.get("trackId","audio-1") in ("","audio-1")
                          and args.get("startSeconds",args.get("startTime",0))==0)
                  record={"status":"PASS" if ok else "WRONG_DECISION"}
              except (NvidiaTransportError,NvidiaConfigurationError,LocalModelOutputError) as e:
                  http=re.search(r"HTTP (\d{3})",str(e))
                  record={"status":"ERROR","error_type":type(e).__name__,"code":getattr(e,"code",None),"http_status":int(http.group(1)) if http else None}
              record.update(case=label,usage=model.last_call_usage,elapsed_s=round(time.monotonic()-started,3))
              results.append(record)
              print("ZX7_ASSET_ROUTE_CASE",json.dumps(record),flush=True)
          passed=all(x["status"]=="PASS" for x in results)
          print("ZX7_ASSET_ROUTE_RESULT",json.dumps({"model":model_id,"cases":results,"passed":passed,"native_dispatches":0,"synthetic_only":True,"hosted_calls_at_most":2}))
          if not passed: raise SystemExit(1)
          PY
