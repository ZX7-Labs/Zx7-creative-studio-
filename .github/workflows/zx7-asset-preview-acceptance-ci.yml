name: ZX7 pinned native asset preview and state acceptance
on:
  push:
    branches: [engineering/host-observed-asset-frontier-20261108]
    paths:
      - ".github/workflows/zx7-asset-preview-acceptance-ci.yml"
      - "studio_next/**"
      - "scripts/**"
      - "engines/velorn/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zx7-asset-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-native-source-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify exact pinned native Electron MCP and run real method tests
        run: |
          test "$(git -C third_party/velorn rev-parse HEAD)" = "b3c02adbd5c0779feb8abf34978299e9502cc0e7"
          node --test engines/velorn/native-marker-preview.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --no-cache-dir '.[production,editor]'
      - name: Source compile and native model protocol regressions
        run: |
          python -m compileall -q studio_next/native_creative_control.py studio_next/native_editor_source_pin.py scripts/run_native_model_trial.py engines/velorn/native-model-client.py
          python -m unittest studio_next.test_native_creative_control studio_next.test_native_creative_audit studio_next.test_body_editor_client studio_next.test_body_editor_mcp studio_next.test_capability_fabric studio_next.test_local_native_structured_model scripts.test_local_native_trial_request scripts.test_run_nvidia_native_trial.RealNvidiaTrialBootstrapTests.test_pinned_real_electron_preview_attestation_requires_clean_exact_source -v
