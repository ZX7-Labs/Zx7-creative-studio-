name: ZX7 Verify Free CC0 Image Bytes from Wikimedia
on:
  push:
    branches:
      - "proof/local-brain-60s-native-film-20261101"
    paths:
      - ".github/workflows/zx7-commons-cc0-byte-probe.yml"
permissions:
  contents: read
jobs:
  actual-open-image-reachability:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe metadata, CC0 license AND physically downloadable JPEG
        run: |
          python - <<'PY'
          import json,urllib.parse,urllib.request
          query=urllib.parse.urlencode({
            'action':'query','format':'json','generator':'categorymembers',
            'gcmtitle':'Category:CC-Zero','gcmtype':'file','gcmlimit':50,
            'prop':'imageinfo','iiprop':'url|mime|extmetadata',
            'iiurlwidth':843,
            'iiextmetadatafilter':'LicenseShortName|LicenseUrl'})
          request=urllib.request.Request('https://commons.wikimedia.org/w/api.php?'+query,
            headers={'User-Agent':'ZX7Studio-CC0-Probe/0.1 (github.com/ZX7-Labs/Zx7-creative-studio-)'})
          with urllib.request.urlopen(request,timeout=18) as conn:
            data=json.load(conn)
          print('COMMONS TOTAL',len(data.get('query',{}).get('pages',{})),flush=True)
          print('API WARNINGS',str(data.get('warnings'))[:350],flush=True)
          lic={}
          candidates=[]
          for page in data.get('query',{}).get('pages',{}).values():
            info=(page.get('imageinfo') or [{}])[0]
            md=info.get('extmetadata') or {}
            if len(lic) < 2:
              print('CC0 API RAW META',page.get('title'),
                    'mime',info.get('mime'),
                    'license',md.get('LicenseShortName'),
                    'licenseurl',md.get('LicenseUrl'),flush=True)
            ln=(md.get('LicenseShortName') or {}).get('value')
            lic[str(ln)]=lic.get(str(ln),0)+1
            if not ln or ln.strip().upper() not in ('CC0','CC0 1.0'):
              continue
            url=info.get('thumburl') or info.get('url')
            if not url:continue
            candidates.append((page.get('title'),url))
          print('LICENSE COUNTS',lic,flush=True)
          print('CC0 CANDIDATES',len(candidates),flush=True)
          success=0
          for name,url in candidates[:12]:
            print('TRY',name,urllib.parse.urlsplit(url).hostname,flush=True)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'ZX7Studio-CC0-Probe/0.1'})
              with urllib.request.urlopen(req,timeout=15) as media:
                data=media.read(8192)
                ctype=media.headers.get('Content-Type')
              print('HTTP',len(data),ctype,'HEAD',repr(data[:8]),flush=True)
              if len(data)>32 and (data[:3]==bytes.fromhex('ffd8ff') or
                                 data[:8]==bytes.fromhex('89504e470d0a1a0a')):
                success+=1
            except Exception as exc:
              print('DOWNLOAD-ERROR',type(exc).__name__,getattr(exc,'code',None),flush=True)
            if success>=3:break
          print('ACTUAL_DOWNLOADABLE_CC0_IMAGES',success,flush=True)
          assert success>=1,'No actual accessible CC0 media bytes despite open metadata'
          PY
