name: ZX7 60-second Genuine Local Brain Native Film
on:
  push:
    branches:
      - "proof/local-brain-60s-native-film-20261101"
      - "feature/real-model-observe-revise-film-20261102"
    paths:
      - "scripts/run_local_brain_creative_film.py"
      - "studio_next/model_film_revision.py"
      - "studio_next/test_model_film_revision.py"
      - ".github/workflows/zx7-local-brain-one-minute-film.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zx7-local-brain-one-minute-film-proof
  cancel-in-progress: true

jobs:
  model-directed-public-domain-60s:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact public ZX7 BODY source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original audio/visual native film engines and full BODY
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg melt frei0r-plugins fonts-dejavu-core
          python -m pip install --no-cache-dir '.[production]'
          python -m compileall -q scripts/run_local_brain_creative_film.py studio_next
      - name: Verify real Commons CC0 source bytes before loading the local model
        run: |
          python - <<'PY'
          import json,urllib.parse,urllib.request
          data=urllib.parse.urlencode({
              "action":"query","format":"json",
              "generator":"categorymembers","gcmtitle":"Category:CC-Zero",
              "gcmtype":"file","gcmlimit":12,
              "prop":"imageinfo","iiprop":"url|mime|extmetadata",
              "iiurlwidth":1280,
              "iiextmetadatafilter":"LicenseShortName|LicenseUrl"})
          url="https://commons.wikimedia.org/w/api.php?"+data
          with urllib.request.urlopen(urllib.request.Request(url,headers={
                  "User-Agent":"ZX7-LocalCreativeFilm/0.1"}),timeout=20) as r:
              result=json.load(r)
          cleared=[]
          for asset in (result.get("query") or {}).get("pages",{}).values():
              info=(asset.get("imageinfo") or [{}])[0]
              license=(info.get("extmetadata") or {}).get("LicenseShortName",{}).get("value")
              if license not in ("CC0","CC0 1.0"):continue
              address=info.get("thumburl") or info.get("url")
              if address and urllib.parse.urlsplit(address).hostname in (
                      "thumb.wikimedia.org","upload.wikimedia.org"):
                  cleared.append(address)
          assert cleared,"No real source images from official CC0 category"
          evidence=0
          for address in cleared[:5]:
              try:
                  with urllib.request.urlopen(urllib.request.Request(address,headers={
                         "User-Agent":"ZX7-LocalCreativeFilm/0.1"}),timeout=12) as r:
                      sample=r.read(8192)
                  if sample.startswith((b"\xff\xd8\xff",b"\x89PNG\r\n\x1a\n")):
                      evidence+=1
              except Exception as exc:
                  print("CC0 image unavailable",type(exc).__name__,flush=True)
          assert evidence>0,"CC0 licensing metadata without accessible physical image bytes"
          print("ACTUAL ACCESSIBLE OFFICIAL CC0 IMAGE SOURCES",evidence,flush=True)
          PY
      - name: Regress sparse model-driven edits against real encoded movies
        run: python -m unittest studio_next.test_model_film_revision -v
      - name: Run source-pinned genuine free local Qwen, model-directed editing and native MLT
        run: |
          python -u scripts/run_local_brain_creative_film.py \
            --model-lock engines/velorn/local-model-trial.lock.json \
            --runtime "$RUNNER_TEMP/zx7-local-model" \
            --output "$GITHUB_WORKSPACE/output/one-minute-neural-film" \
            --alternate-cut
      - name: Preserve model decisions, source artwork provenance, native project, soundtrack, video and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-actual-local-ai-60s-proof
          path: |
            output/one-minute-neural-film/evidence.json
            output/one-minute-neural-film/actual-model-transcript.json
            output/one-minute-neural-film/model-authored-film-plan.json
            output/one-minute-neural-film/model-authored-revised-film-plan.json
            output/one-minute-neural-film/model-original-export-review.json
            output/one-minute-neural-film/source-asset-evidence.json
            output/one-minute-neural-film/FINAL-MOVIE-RECEIPT.json
            output/one-minute-neural-film/workspace/ZX7-LOCAL-AI-ONE-MINUTE.mp4
            output/one-minute-neural-film/workspace/ZX7-LOCAL-AI-ONE-MINUTE-REVISED.mp4
            output/one-minute-neural-film/workspace/zx7-model-native-edit-revised.mlt
            output/one-minute-neural-film/workspace/model-to-native-mlt-revised.json
            output/one-minute-neural-film/workspace/effects/first-encoded-film-preview.png
            output/one-minute-neural-film/workspace/effects/focused-original-beat-*.png
            output/one-minute-neural-film/workspace/revision-01/
            output/one-minute-neural-film/workspace/zx7-model-native-edit.mlt
            output/one-minute-neural-film/workspace/model-to-native-mlt.json
            output/one-minute-neural-film/workspace/source/
            output/one-minute-neural-film/workspace/art/
            output/one-minute-neural-film/workspace/vault/
            output/one-minute-neural-film/model-server.log
          if-no-files-found: warn
          retention-days: 14
