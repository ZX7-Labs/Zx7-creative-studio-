name: "ZX7 one-use Omni source-affordance real audiovisual acceptance"
# One-use, source-pinned, explicitly owner-authorized G1 experiment.
# NOT a normal CI trigger, public media upload, release gate, or automatic fallback.
on:
  push:
    branches: [trial/g1-omni-source-affordance-20261125]
    paths:
      - ".github/workflows/zx7-oneuse-omni-source-affordance-20261125.yml"
permissions:
  contents: read
concurrency:
  group: zx7-oneuse-g1-omni-frontier-20261125
  cancel-in-progress: false
jobs:
  genuine-omni-native-av:
    if: github.run_attempt == 1 && github.ref == 'refs/heads/trial/g1-omni-source-affordance-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout reviewed exact BODY and pinned Velorn without persisted credentials
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 3
          persist-credentials: false
      - name: Authenticate exact owner-scoped source, only two audit files, and one-use request
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/trial/g1-omni-source-affordance-20261125"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD^)" = "e4a4e49db474fdf5081254322c4b169f1ef7c1ee"
          expected="$(printf '%s\n' '.github/workflows/zx7-oneuse-omni-source-affordance-20261125.yml' 'research/nvidia-oneuse-omni-source-affordance-20261125.json' | LC_ALL=C sort)"
          actual="$(git diff --name-only e4a4e49db474fdf5081254322c4b169f1ef7c1ee HEAD | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --check e4a4e49db474fdf5081254322c4b169f1ef7c1ee HEAD
          python -m scripts.nvidia_av_trial_request research/nvidia-oneuse-omni-source-affordance-20261125.json --dispatch-request-id ZX7_OMNI_G1_E4A4_FRONTIER_20261125
          test "$(git -C third_party/velorn rev-parse HEAD)" = "b3c02adbd5c0779feb8abf34978299e9502cc0e7"
          git -C third_party/velorn diff --exit-code HEAD --
          echo "REVIEWED_SOURCE_48_TURN_ONE_USE_CONSENT_VALIDATED"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install real native-editor codecs, X11, sandbox and existing BODY dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg xvfb xauth x11-xkb-utils xkb-data \
            libnss3 libatk-bridge2.0-0 libasound2t64 libgtk-3-0 \
            libgbm1 libxss1 libxdamage1 libxcomposite1 libxrandr2 libx11-xcb1
          python -m pip install --no-cache-dir '.[editor,production]'
      - name: Validate current real Omni native model and exact one-use request before building
        run: |
          set -euo pipefail
          python -m unittest studio_next.test_nvidia_native_tool_model scripts.test_nvidia_av_trial_request -v
          python -m scripts.nvidia_av_trial_request research/nvidia-oneuse-omni-source-affordance-20261125.json --dispatch-request-id ZX7_OMNI_G1_E4A4_FRONTIER_20261125
      - name: Rebuild exact cumulative BODY-integrated source pinned native editor
        shell: bash
        run: |
          set -euo pipefail
          editor="$RUNNER_TEMP/zx7-omni-cumulative-native-editor"
          bash engines/velorn/prepare-native-loss-aware-extract-candidate.sh \
            "$GITHUB_WORKSPACE/third_party/velorn" "$editor" --install
          expected="$(python -c 'import json;print(json.load(open("studio_next/editor_runtime/source-lock.json"))["loss_aware_extract_revision"])')"
          test "$(git -C "$editor" rev-parse HEAD)" = "$expected"
          git -C "$editor" diff --exit-code HEAD --
          echo "ZX7_INTEGRATED_NATIVE_EDITOR=$editor" >> "$GITHUB_ENV"
      - name: Build actual source-pinned Electron native app with no provider credential
        shell: bash
        run: |
          set -euo pipefail
          cd "$ZX7_INTEGRATED_NATIVE_EDITOR"
          bash "$GITHUB_WORKSPACE/engines/velorn/install-ci-dependencies.sh" supported-electron
          npm run build
          test -s dist/index.html
      - name: Preserve actual Chromium sandbox and unprivileged native editor
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          helper="$ZX7_INTEGRATED_NATIVE_EDITOR/node_modules/electron/dist/chrome-sandbox"
          test -f "$helper"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          test "$(stat -c '%u:%a' "$helper")" = "0:4755"
      - name: One genuine Omni Brain chooses native video/sound edits, reviews, revises, verifies
        shell: bash
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            echo "Missing authorized NVIDIA_API_KEY; no provider trial"
            exit 2
          fi
          model="$(python -m scripts.nvidia_av_trial_request --print-model \
            research/nvidia-oneuse-omni-source-affordance-20261125.json \
            --dispatch-request-id ZX7_OMNI_G1_E4A4_FRONTIER_20261125)"
          test "$model" = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"
          python -u -m scripts.run_nvidia_native_trial \
            --workspace "$RUNNER_TEMP/zx7-omni-native-trial" \
            --model-id "$model" \
            --integrated-editor-source "$ZX7_INTEGRATED_NATIVE_EDITOR" \
            --xvfb-binary /usr/bin/Xvfb --display 127.0.0.1:95 \
            --audiovisual-trial --allow-cloud-audio-diagnostics \
            --allow-cloud-synthetic-wav
      - name: Verify original and cumulative editor sources were never rewritten
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C third_party/velorn rev-parse HEAD)" = "b3c02adbd5c0779feb8abf34978299e9502cc0e7"
          git -C third_party/velorn diff --exit-code HEAD --
          if [[ -n "${ZX7_INTEGRATED_NATIVE_EDITOR:-}" ]]; then
            expected="$(python -c 'import json;print(json.load(open("studio_next/editor_runtime/source-lock.json"))["loss_aware_extract_revision"])')"
            test "$(git -C "$ZX7_INTEGRATED_NATIVE_EDITOR" rev-parse HEAD)" = "$expected"
            git -C "$ZX7_INTEGRATED_NATIVE_EDITOR" diff --exit-code HEAD --
          fi
      - name: Preserve only authorized synthetic physical A/V, redacted journal and native project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-oneuse-omni-source-frontier-real-av-${{ github.sha }}
          path: |
            ${{ runner.temp }}/zx7-omni-native-trial/host-grants.json
            ${{ runner.temp }}/zx7-omni-native-trial/brief.txt
            ${{ runner.temp }}/zx7-omni-native-trial/source-ledger.json
            ${{ runner.temp }}/zx7-omni-native-trial/native-evaluation.json
            ${{ runner.temp }}/zx7-omni-native-trial/native-journal.jsonl
            ${{ runner.temp }}/zx7-omni-native-trial/native-client-stdout.txt
            ${{ runner.temp }}/zx7-omni-native-trial/native-client-stderr.txt
            ${{ runner.temp }}/zx7-omni-native-trial/staging/original-neutral-gradient.mp4
            ${{ runner.temp }}/zx7-omni-native-trial/staging/original-synthetic-sound.wav
            ${{ runner.temp }}/zx7-omni-native-trial/outputs/*.mp4
            ${{ runner.temp }}/zx7-omni-native-trial/projects/**/*.comfystudio
            ${{ runner.temp }}/zx7-omni-native-trial/projects/**/assets/video/*.mp4
            ${{ runner.temp }}/zx7-omni-native-trial/projects/**/assets/audio/*.wav
            ${{ runner.temp }}/zx7-omni-native-trial/projects/**/project.thumbnail.webp
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 7
