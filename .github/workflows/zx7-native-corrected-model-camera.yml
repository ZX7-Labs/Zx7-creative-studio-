name: ZX7 Source-Compatible Qwen Camera Native Trial
on:
  push:
    branches: ["engineering/unified-brain-body-architecture-audit-20261106"]
    paths:
      - ".github/workflows/zx7-native-corrected-model-camera.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zx7-corrected-camera-model-${{ github.ref }}
  cancel-in-progress: false
jobs:
  real-local-model-native-camera:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install local open-source editor and decoder dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg xvfb xauth x11-xkb-utils xkb-data \
            libnss3 libatk-bridge2.0-0 libasound2t64 libgtk-3-0 \
            libgbm1 libxss1 libxdamage1 libxcomposite1 libxrandr2 libx11-xcb1
          python -m pip install --no-cache-dir '.[editor,production]'
      - name: Fail fast on authoritative asset import reconciliation and project-read contracts
        run: |
          python -m unittest -q \
            studio_next.test_native_machine_navigator \
            studio_next.test_native_asset_identity \
            studio_next.test_native_creative_control \
            studio_next.test_native_creative_audit \
            studio_next.test_native_host_contract_probe
      - name: Re-check fixed GPL native editor source and sandbox identity
        run: |
          test "$(id -u)" -ne 0
          test "$(git -C third_party/velorn rev-parse HEAD)" = "b3c02adbd5c0779feb8abf34978299e9502cc0e7"
          git -C third_party/velorn diff --exit-code HEAD --
      - name: Build actual complete native Velorn application
        working-directory: third_party/velorn
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -s dist/index.html
          helper="$PWD/node_modules/electron/dist/chrome-sandbox"
          test -f "$helper"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          test "$(stat -c '%u:%a' "$helper")" = "0:4755"
      - name: Acquire and physically decode the existing verified Commons CC0-claimed original
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,urllib.parse,urllib.request
          folder=pathlib.Path(os.environ["RUNNER_TEMP"])/"zx7-camera-source"
          folder.mkdir(mode=0o700)
          title="Royal_Sovereign_Lighthouse_drone_visit.webm"
          sha_expected="52d9b05bec542094c5bada760bad18af2fdbec03374488db65ae0f45ef96184f"
          api="https://commons.wikimedia.org/w/api.php?"+urllib.parse.urlencode({
            "action":"query","format":"json","titles":"File:"+title.replace("_"," "),
            "prop":"imageinfo","iiprop":"url|size|mime|extmetadata",
            "iiextmetadatafilter":"LicenseShortName|Artist|UsageTerms"})
          headers={"User-Agent":"ZX7CreativeStudio/0.1 (https://github.com/ZX7-Labs/Zx7-creative-studio-)"}
          with urllib.request.urlopen(urllib.request.Request(api,headers=headers),timeout=35) as response:
            metadata=json.load(response)
          info=next(iter(metadata["query"]["pages"].values()))["imageinfo"][0]
          license_name=(info.get("extmetadata") or {}).get("LicenseShortName",{}).get("value")
          if license_name not in ("CC0","CC0 1.0"):
            raise ValueError("Live official source no longer declares CC0")
          tag=hashlib.md5(title.encode()).hexdigest()
          url=("https://upload.wikimedia.org/wikipedia/commons/transcoded/"
               +tag[0]+"/"+tag[:2]+"/"+title+"/"+title+".720p.vp9.webm")
          target=folder/"camera_take_01.webm"
          digest=hashlib.sha256()
          total=0
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as stream, target.open("xb") as output:
            while data:=stream.read(1024*1024):
              total+=len(data)
              if total>200_000_000:raise ValueError("Camera exceeds public experiment budget")
              digest.update(data)
              output.write(data)
          if digest.hexdigest()!=sha_expected:
            raise ValueError("Original camera bytes drifted from independently checked prior source")
          probe=json.loads(subprocess.run(["ffprobe","-v","error","-show_entries",
            "format=duration:stream=codec_type,width,height","-of","json",str(target)],
            capture_output=True,text=True,check=True,timeout=60).stdout)
          duration=float(probe["format"]["duration"])
          if not 30<=duration<=1200:raise ValueError("Camera source duration invalid")
          subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-nostdin",
            "-xerror","-i",str(target),"-map","0:v:0","-f","null","-"],
            capture_output=True,check=True,timeout=420)
          rights={"sha256":sha_expected,"bytes":total,"duration_seconds":duration,
            "license_declared_by_source":license_name,
            "full_picture_decode_completed":True,
            "rights_legally_cleared":False,
            "original_file_page":"https://commons.wikimedia.org/wiki/File:"+title}
          (folder/"rights.json").write_text(json.dumps(rights,indent=2))
          print("Real original verified:",duration,"seconds",total,"bytes, video decoder passed")
          PY
      - name: Execute genuine local Qwen vision + complete native editor on original camera
        run: |
          python -u scripts/run_native_model_trial.py \
            --model-lock "$GITHUB_WORKSPACE/engines/velorn/local-model-trial.lock.json" \
            --source "$GITHUB_WORKSPACE/third_party/velorn" \
            --runtime "$RUNNER_TEMP/zx7-native-camera-model-runtime" \
            --artifacts "$GITHUB_WORKSPACE/output/native-camera-pilot" \
            --camera-video "$RUNNER_TEMP/zx7-camera-source/camera_take_01.webm" \
            --camera-rights "$RUNNER_TEMP/zx7-camera-source/rights.json" \
            --xvfb-binary /usr/bin/Xvfb \
            --display 127.0.0.1:95
      - name: Verify upstream source remains unchanged
        if: always()
        run: |
          git -C third_party/velorn diff --exit-code HEAD --
      - name: Preserve non-media evidence only (no camera/video public upload)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-corrected-native-camera-evidence-${{ github.sha }}
          path: |
            output/native-camera-pilot/evidence.json
            output/native-camera-pilot/journal-audit.json
            output/native-camera-pilot/native-journal.jsonl
          if-no-files-found: warn
          retention-days: 5
