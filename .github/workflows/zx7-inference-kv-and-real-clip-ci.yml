name: ZX7 exact-head real-clip and CPU prefix regression
on:
  push:
    branches: [engineering/host-observed-asset-frontier-20261108]
    paths:
      - ".github/workflows/zx7-inference-kv-and-real-clip-ci.yml"
      - "studio_next/**"
      - "scripts/**"
      - "engines/velorn/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zx7-local-prefix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          test "$(git -C third_party/velorn rev-parse HEAD)" = "b3c02adbd5c0779feb8abf34978299e9502cc0e7"
          node --test engines/velorn/native-marker-preview.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --no-cache-dir '.[editor,production]'
      - name: Compile exact current source
        run: |
          python -m compileall -q studio_next/local_native_structured_model.py studio_next/native_creative_control.py studio_next/native_creative_audit.py scripts/run_native_model_trial.py engines/velorn/native-model-client.py
      - name: Native creative model, actual source and adversarial regression tests
        run: |
          python -m unittest -v studio_next.test_local_native_structured_model studio_next.test_native_creative_control studio_next.test_native_creative_audit studio_next.test_capability_fabric studio_next.test_body_editor_client studio_next.test_body_editor_mcp scripts.test_local_native_trial_request scripts.test_run_nvidia_native_trial.RealNvidiaTrialBootstrapTests.test_pinned_real_electron_preview_attestation_requires_clean_exact_source
