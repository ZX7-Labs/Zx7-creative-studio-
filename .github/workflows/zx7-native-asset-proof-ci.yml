name: "ZX7 Native Saved Source Acceptance — focused regression"
on:
  push:
    branches:
      - engineering/native-active-source-proof-20261108
    paths:
      - ".github/workflows/zx7-native-asset-proof-ci.yml"
      - "scripts/run_nvidia_native_trial.py"
      - "scripts/test_run_nvidia_native_trial.py"
permissions:
  contents: read
concurrency:
  group: zx7-saved-source-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  saved-source-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --no-cache-dir '.[production,editor]'
      - run: python -m compileall -q scripts/run_nvidia_native_trial.py scripts/test_run_nvidia_native_trial.py
      - name: Verify source, native metadata and physical frame-identity acceptance
        run: |
          python -m unittest             scripts.test_run_nvidia_native_trial             studio_next.test_nvidia_model             studio_next.test_native_creative_audit -v
