name: ZX7 isolated full save content plus private render registry
on:
  push:
    branches: [fix/g1-acknowledged-save-autosave-content-identity-20261126]
    paths: [.github/workflows/zx7-oneuse-g1-acknowledged-save-autosave-20261126.yml]
permissions:
  contents: read
jobs:
  saved-project-source-custody:
    if: github.ref == 'refs/heads/fix/g1-acknowledged-save-autosave-content-identity-20261126' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 12
          submodules: false
          persist-credentials: false
      - name: Check exact source ancestry and only known source/test files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '94d33d6c5919b6af02c85783d0456b42455acb46'
          test "$(git rev-parse HEAD^^)" = 'b88b404324d5e3261757123f59d384e8dc69278c'
          test "$(git rev-parse HEAD~8)" = '2b626445ecabd3a2837ac549a98ba9dcda94b96d'
          test "$(git diff --name-only HEAD^^ HEAD^)" = "$(printf '%s\n' engines/velorn/mcp-e2e.py studio_next/native_editor_project.py)"
          git diff --check HEAD~8 HEAD
          python -m py_compile engines/velorn/mcp-e2e.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --no-cache-dir '.[editor,production]'
      - name: Preserve original fail and reproduce separate native saved registry corruption (RED)
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/zx7-private-saves-red" 'b88b404324d5e3261757123f59d384e8dc69278c'
          cd "$RUNNER_TEMP/zx7-private-saves-red"
          if python -m unittest studio_next.test_native_editor_project.RenderSnapshotTests.test_actual_native_autosave_timestamps_cannot_overwrite_model_approved_content -v > "$RUNNER_TEMP/native-private-saves-red.log" 2>&1; then
            cat "$RUNNER_TEMP/native-private-saves-red.log"
            echo "Expected private saved-registry isolation failure did not reproduce"
            exit 1
          fi
          cat "$RUNNER_TEMP/native-private-saves-red.log"
          grep -F "FAILED (failures=1)" "$RUNNER_TEMP/native-private-saves-red.log"
      - name: Prove saved physical content, owner boundaries, model custody and registry isolation
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest studio_next.test_native_editor_project studio_next.test_native_creative_control studio_next.test_native_revision_observation studio_next.test_native_source_feedback studio_next.test_native_render_evidence -v
