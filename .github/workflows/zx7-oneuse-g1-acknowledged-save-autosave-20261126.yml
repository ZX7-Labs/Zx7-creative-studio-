name: ZX7 isolated genuine-save native-autosave source identity
on:
  push:
    branches: [fix/g1-acknowledged-save-autosave-content-identity-20261126]
    paths: [.github/workflows/zx7-oneuse-g1-acknowledged-save-autosave-20261126.yml]
permissions:
  contents: read
jobs:
  save-content-custody:
    if: github.ref == 'refs/heads/fix/g1-acknowledged-save-autosave-content-identity-20261126' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 6
          submodules: false
          persist-credentials: false
      - name: Validate exact RED/GREEN provenance and content-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'f141dcb4359b88803660234e1d329cdceac2d2cd'
          test "$(git rev-parse HEAD^^)" = '8889629c94972f14d13ea598935d9dc7fe6e4547'
          test "$(git rev-parse HEAD^^^^)" = '2b626445ecabd3a2837ac549a98ba9dcda94b96d'
          test "$(git diff --name-only HEAD^^^^ HEAD^^^)" = "studio_next/test_native_editor_project.py"
          test "$(git diff --name-only HEAD^^^ HEAD^^)" = "studio_next/test_native_creative_control.py"
          test "$(git diff --name-only HEAD^^ HEAD^)" = "$(printf '%s\n' studio_next/native_creative_control.py studio_next/native_editor_project.py studio_next/native_editor_session.py)"
          git diff --check HEAD^^^^ HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing project dependency contracts
        run: python -m pip install --disable-pip-version-check --no-cache-dir '.[editor,production]'
      - name: Prove original real-model autosave regression first (RED)
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/zx7-red-autosave" '8889629c94972f14d13ea598935d9dc7fe6e4547'
          cd "$RUNNER_TEMP/zx7-red-autosave"
          if python -m unittest studio_next.test_native_editor_project.RenderSnapshotTests.test_actual_native_autosave_timestamps_cannot_overwrite_model_approved_content studio_next.test_native_creative_control.NativeCreativeControlTests.test_verified_save_anchor_survives_read_only_autosaves_before_render -v > "$RUNNER_TEMP/red-native-autosave.txt" 2>&1; then
            cat "$RUNNER_TEMP/red-native-autosave.txt"
            echo "Expected exact RED failed to reproduce"
            exit 1
          fi
          cat "$RUNNER_TEMP/red-native-autosave.txt"
          grep -F "FAILED (errors=2)" "$RUNNER_TEMP/red-native-autosave.txt"
      - name: Verify strict timestamp-only equivalence with physical media and model custody (GREEN)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest studio_next.test_native_editor_project studio_next.test_native_creative_control studio_next.test_native_revision_observation studio_next.test_native_source_feedback studio_next.test_native_render_evidence -v
      - name: Check TDD and source report
        if: always()
        shell: bash
        run: git status --short
