name: ZX7 Creative Research — Real Free Public APIs
on:
  pull_request:
    branches: [main]
    paths:
      - "studio_next/creative_research.py"
      - "studio_next/test_creative_research.py"
      - ".github/workflows/zx7-creative-research-live.yml"
  workflow_dispatch:
  push:
    branches: ['feature/**']
    paths: ['studio_next/creative_research*.py', 'studio_next/test_creative_research*.py', 'studio_next/body_service.py', 'studio_next/test_body_service.py', '.github/workflows/zx7-creative-research-live.yml']
permissions:
  contents: read

jobs:
  public-api-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Local offline parsing, license and safety regressions
        run: |
          python -m pip install --no-cache-dir '.[production,research]'
          python -m unittest studio_next.test_creative_research studio_next.test_creative_research_hub studio_next.test_body_service -v
      - name: Real anonymous HTTPS requests to free official public APIs
        run: |
          python - <<'PY'
          from studio_next.creative_research import CreativeResearch
          research = CreativeResearch()
          checks = []
          for media, query in (
              ("image", "landscape"),
              ("audio", "ambient"),
              ("video", "nature"),
          ):
              try:
                  result = research.assets(query=query, media=media, limit=3)
                  assert result["kind"] == "research_asset_candidates"
                  assert not result["rights_verified"]
                  assert not result["import_authorized"]
                  assert all(asset["declared_license"] == "CC0" and
                             asset["rights_status"] == "candidate_unverified"
                             for asset in result["results"])
                  print(f"REAL {result['provider']}/{media}: "
                        f"{len(result['results'])} metadata candidates; no files imported",
                        flush=True)
                  checks.append((media, True))
              except Exception as exc:
                  print(f"REAL {media}: FAILED {type(exc).__name__}: {exc}", flush=True)
                  checks.append((media, False))
          try:
              papers = research.studies(query="narrative transportation film editing",limit=3)
              assert papers["kind"] == "creative_audience_research"
              assert all(not paper["study_results_verified"] for paper in papers["results"])
              print(f"REAL crossref: {len(papers['results'])} DOI records, "
                    "no audience effect fabricated", flush=True)
              checks.append(("studies", True))
          except Exception as exc:
              print(f"REAL studies: FAILED {type(exc).__name__}: {exc}", flush=True)
              checks.append(("studies", False))
          print("Provider status:", checks, flush=True)
          if not all(success for _, success in checks):
              raise SystemExit("Free public API live contracts have unresolved failures")
          PY
