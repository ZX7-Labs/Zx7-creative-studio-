name: "ZX7 one-use exact Omni indexed source-ID contract RED/GREEN (offline)"
on:
  push:
    branches: [trial/g1-omni-indexed-asset-observation-20261125]
    paths:
      - ".github/workflows/zx7-oneuse-omni-indexed-assets-offline-20261125.yml"
      - "studio_next/test_native_creative_control.py"
      - "studio_next/native_creative_control.py"
permissions:
  contents: read
concurrency:
  group: zx7-oneuse-omni-indexed-source-20261125
  cancel-in-progress: false
jobs:
  actual-model-indexed-source-abi:
    if: github.run_attempt == 1 && github.ref == 'refs/heads/trial/g1-omni-indexed-asset-observation-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 4
          submodules: recursive
      - name: Check exact pinned production parent and source scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a82dc3a368834d33fec64744e81cdfb7ffbbd2cb"
          git diff --check HEAD^ HEAD
          # Source comparisons are exact and never alter the original.
          actual="$(git diff --name-only a82dc3a368834d33fec64744e81cdfb7ffbbd2cb HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' '.github/workflows/zx7-oneuse-omni-indexed-assets-offline-20261125.yml' 'studio_next/test_native_creative_control.py' | LC_ALL=C sort)"
          test "$actual" = "$expected"
      - name: Install existing editor test dependency, no media or NVIDIA calls
        run: python -m pip install --disable-pip-version-check --no-cache-dir '.[editor]'
      - name: Execute actual indexed native model regression, real controller
        run: python -m unittest -v studio_next.test_native_creative_control.NativeCreativeControlTests.test_full_native_provider_gets_attested_imported_asset_ids_without_dispatch
